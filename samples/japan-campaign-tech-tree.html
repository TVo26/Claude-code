<body>
<canvas id="c" role="img" aria-label="An interactive, hand-drawn tech tree of Japanese history in eight eras, built from the Japan Long Campaign gamified script. Click any tech to read its card."></canvas>
<script>
'use strict';
/* Japan: The Long Campaign, as an interactive tech tree. Every frame is drawn with Canvas 2D; no images, no libs.
   Controls: click a tech = open its card · space = pause · 1–8 = jump to an era · R = restart · ← → seek 2 s
             ?t=12.5 opens paused at that time · ?node=taiho opens a card */
const W = 1280, H = 720;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let K = 1;

const P = {
  paper:'#fbf6ec', ink:'#4a4453', inkSoft:'#8a8294',
  red:'#f2837b', redD:'#d9665f', pink:'#f9c9d2', pinkL:'#fde8ec',
  blue:'#a9d6f2', blueL:'#e3f2fc', green:'#a8dca0', greenD:'#6fae73', greenL:'#e3f5df',
  yellow:'#fbe39a', yellowL:'#fff5d1', purple:'#cdb8ee', purpleL:'#efe6fb',
  orange:'#fbc79a', orangeL:'#feecdc', mint:'#aee8d6', mintL:'#e2f7f0',
  gray:'#e2dcd2', grayD:'#b1a9a0'
};
const SCOL = ['#f9b8c4','#cdb8ee','#a9d6f2','#a8dca0','#fbe39a','#fbc79a','#d9c2f0','#aee8d6','#c7e59a','#f2837b'];
const FONT = '"Comic Sans MS","Comic Neue","Chalkboard SE","Marker Felt","Segoe Print",cursive';
const MONO = '"Courier New",ui-monospace,monospace';

/* ---------- math + seeded jitter (the "boil" of a hand-drawn line) ---------- */
let seed = 1;
function R(){ seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const J = a => (R() * 2 - 1) * a;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = t => 1 - Math.pow(1 - t, 3);
const eIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const back = t => { if (t <= 0) return 0; const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const TAU = Math.PI * 2;

function withA(a, fn){ if (a <= 0) return; const g = ctx.globalAlpha; ctx.globalAlpha = g * Math.min(1, a); fn(); ctx.globalAlpha = g; }

/* ---------- sketchy primitives ---------- */
function subdiv(pts, closed, maxL){
  const out = [], n = pts.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++){
    const a = pts[i], b = pts[(i + 1) % n]; out.push(a);
    const k = Math.floor(Math.hypot(b[0] - a[0], b[1] - a[1]) / maxL);
    for (let j = 1; j <= k; j++){ const u = j / (k + 1); out.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u)]); }
  }
  if (!closed) out.push(pts[n - 1]);
  return out;
}
function trace(pts, closed, amp){
  const q = pts.map(p => [p[0] + J(amp), p[1] + J(amp)]), n = q.length;
  ctx.beginPath();
  if (closed){
    let m = [(q[n-1][0] + q[0][0]) / 2, (q[n-1][1] + q[0][1]) / 2]; ctx.moveTo(m[0], m[1]);
    for (let i = 0; i < n; i++){ const b = q[(i + 1) % n]; m = [(q[i][0] + b[0]) / 2, (q[i][1] + b[1]) / 2]; ctx.quadraticCurveTo(q[i][0], q[i][1], m[0], m[1]); }
    ctx.closePath();
  } else {
    ctx.moveTo(q[0][0], q[0][1]);
    for (let i = 1; i < n - 1; i++){ const b = q[i + 1]; ctx.quadraticCurveTo(q[i][0], q[i][1], (q[i][0] + b[0]) / 2, (q[i][1] + b[1]) / 2); }
    ctx.lineTo(q[n-1][0], q[n-1][1]);
  }
}
function bbox(pts){ let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const p of pts){ a = Math.min(a, p[0]); b = Math.min(b, p[1]); c = Math.max(c, p[0]); d = Math.max(d, p[1]); } return [a, b, c, d]; }
function hatch(x0, y0, x1, y1, c, gap = 9){
  const g = ctx.globalAlpha; ctx.globalAlpha = g * .3; ctx.strokeStyle = c; ctx.lineWidth = 1.3; ctx.beginPath();
  for (let d = x0 - (y1 - y0); d < x1; d += gap){ ctx.moveTo(d + J(1), y1 + J(1)); ctx.lineTo(d + (y1 - y0) + J(1), y0 + J(1)); }
  ctx.stroke(); ctx.globalAlpha = g;
}
function shape(pts, o = {}){
  const closed = o.closed !== false, amp = o.amp ?? 1.2, w = o.w ?? 2.2;
  if (o.fill){ ctx.fillStyle = o.fill; trace(pts, closed, amp * .4); ctx.fill(); }
  if (o.hatch){ const b = bbox(pts); ctx.save(); trace(pts, closed, 0); ctx.clip(); hatch(b[0], b[1], b[2], b[3], o.hatch, o.gap || 9); ctx.restore(); }
  if (o.stroke !== null){
    ctx.strokeStyle = o.stroke || P.ink; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (o.dash) ctx.setLineDash(o.dash);
    ctx.lineWidth = w; trace(pts, closed, amp); ctx.stroke();
    const g = ctx.globalAlpha; ctx.globalAlpha = g * .45; ctx.lineWidth = w * .6; trace(pts, closed, amp * 1.8); ctx.stroke(); ctx.globalAlpha = g;
    ctx.setLineDash([]);
  }
}
function rrPts(x, y, w, h, r){
  r = Math.max(2, Math.min(r, w / 2, h / 2)); const pts = [];
  const cs = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of cs) for (let i = 0; i <= 3; i++){ const a = a0 + i / 3 * Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return subdiv(pts, true, 55);
}
function ellPts(cx, cy, rx, ry, n){ n = n || Math.max(12, Math.min(32, Math.round((rx + ry) * .35))); const p = []; for (let i = 0; i < n; i++){ const a = i / n * TAU; p.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return p; }
const rect = (x, y, w, h, o = {}) => shape(rrPts(x, y, w, h, o.r ?? 8), o);
const circ = (cx, cy, r, o = {}) => shape(ellPts(cx, cy, r, o.ry ?? r), o);
const poly = (pts, o = {}) => shape(subdiv(pts, false, o.seg || 40), { ...o, closed:false });
function line(x1, y1, x2, y2, c = P.ink, w = 2.2){
  const len = Math.hypot(x2 - x1, y2 - y1) || 1, nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
  ctx.strokeStyle = c; ctx.lineCap = 'round'; const g = ctx.globalAlpha;
  for (let p = 0; p < 2; p++){
    ctx.lineWidth = p ? w * .55 : w; ctx.globalAlpha = p ? g * .5 : g;
    const bow = J(1) * Math.min(3, len * .03), ax = x1 + J(1), ay = y1 + J(1), bx = x2 + J(1), by = y2 + J(1);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo((ax + bx) / 2 + nx * bow, (ay + by) / 2 + ny * bow, bx, by); ctx.stroke();
  }
  ctx.globalAlpha = g;
}
function arrow(x1, y1, x2, y2, c = P.ink, w = 2.2, p = 1, dash){
  if (p <= 0) return; const ex = lerp(x1, x2, p), ey = lerp(y1, y2, p);
  poly([[x1, y1], [ex, ey]], { stroke:c, w, dash, amp:.8 });
  const a = Math.atan2(ey - y1, ex - x1), L = 12;
  line(ex, ey, ex - Math.cos(a - .45) * L, ey - Math.sin(a - .45) * L, c, w);
  line(ex, ey, ex - Math.cos(a + .45) * L, ey - Math.sin(a + .45) * L, c, w);
}
function txt(s, x, y, size = 20, c = P.ink, align = 'center', bold = false, font = FONT){
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${font}`; ctx.fillStyle = c; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function txtW(s, size, bold = false, font = FONT){ ctx.font = `${bold ? 'bold ' : ''}${size}px ${font}`; return ctx.measureText(s).width; }
function bubble(x, y, s, tx, ty, size = 18){
  const w = txtW(s, size, true) + 30, h = size + 20;
  rect(x - w / 2, y - h / 2, w, h, { fill:'#fff', r:h / 2, w:2 });
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - 10, y + h / 2 - 4); ctx.lineTo(tx, ty); ctx.lineTo(x + 10, y + h / 2 - 4); ctx.fill();
  line(x - 10, y + h / 2 - 1, tx, ty, P.ink, 2); line(x + 10, y + h / 2 - 1, tx, ty, P.ink, 2);
  txt(s, x, y + 1, size, P.ink, 'center', true);
}
function star(cx, cy, r1, r2, n, rot, o){ const p = []; for (let i = 0; i < n * 2; i++){ const a = rot + i / (n * 2) * TAU - Math.PI / 2, r = i % 2 ? r2 : r1; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } shape(p, { amp:.6, ...o }); }
function sparkle(x, y, s, rot = 0){ star(x, y, 12 * s, 3.5 * s, 4, rot, { fill:P.yellow, w:1.6 }); }
function gear(cx, cy, r, teeth, rot, fill){
  const p = [], n = teeth * 4;
  for (let i = 0; i < n; i++){ const a = rot + i / n * TAU, rr = (i % 4 < 2) ? r : r * .78; p.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
  shape(p, { fill, w:2, amp:.5 }); circ(cx, cy, r * .3, { fill:'#fff', w:1.8 });
}
function check(x, y, s = 1){ circ(x, y, 11 * s, { fill:P.green, w:1.8 }); poly([[x - 5 * s, y], [x - 1 * s, y + 4 * s], [x + 6 * s, y - 5 * s]], { w:2.6 * s, amp:.3 }); }
function lock(x, y, s = 1){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = P.ink; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-10, -10); ctx.arc(0, -10, 10, Math.PI, 0); ctx.lineTo(10, 0); ctx.stroke();
  rect(-17, -3, 34, 27, { fill:P.yellow, r:6 }); circ(0, 8, 3.5, { fill:P.ink, w:1 }); ctx.restore();
}
function leaf(x, y, ang, sz){
  if (sz < .6) return; ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  shape(ellPts(sz * 1.2, 0, sz * 1.2, sz * .55, 10), { fill:P.green, stroke:P.greenD, w:1.5, amp:.35 });
  ctx.restore();
}

/* ---------- frame chrome: paper, stage label, caption, progress ---------- */
function paper(){
  ctx.fillStyle = P.paper; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(150,185,215,.15)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let y = 100; y < H; y += 32){ ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke();
  const s0 = seed; seed = 4242; ctx.fillStyle = 'rgba(120,100,80,.08)';
  for (let i = 0; i < 280; i++) ctx.fillRect(R() * W, R() * H, 1 + R() * 1.6, 1 + R() * 1.6);
  seed = s0;
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(130,95,60,.10)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* =====================================================================

   Content comes only from the gamified script (Japan_Campaign_Gamified.md).
   Arrows mean "leads to / needed for" in the script's own words; dashed
   things are uncertain, inferred or debated. Wars, famine, colonial rule
   and disasters are left off the board on purpose (the script's house rule).
   ===================================================================== */
const NCOL = 8, X0 = 20, CW = 155, NW = 136, NH = 42, Y0 = 204, RH = 52, T0 = 3, ESEC = 5;
const colX = c => X0 + CW * c + CW / 2;

const TERMS = {

  'Unlock':'Something becomes available. That is different from being widely used: unlocked is not adopted.',
  'Upkeep':'The recurring cost of keeping something running. It never skips a turn.',
  'Tech tree':'The web of what leads to what. A network, not a ladder.',
  'Map control':'The practical ability to use, watch and restrict the places that matter. Not the same as owning every square.',
  'Prerequisite':'What you need before something new becomes possible.',
  'Age up':'A transition to a new phase, shown after we have seen what actually changed.',
  'Counterplay':'A response shaped to answer a specific threat.',
  'Resource bottleneck':'The one scarce input that limits everything else.',
  'Power spike':'A sharp jump in strength at a particular moment.',
  'Build order':'The sequence things get built in. Often only visible as a plan from the replay.',
  'Timing window':'A short stretch when an opening exists.',
  'Win condition':'What victory means for this particular player. History has no shared victory screen.',
  'Tech switch':'Rebuilding what your economy or army runs on, mid-game.',
  'Snowball':'A lead that feeds itself in a loop.'
};
const TKEYS = Object.keys(TERMS), tcol = k => SCOL[(TKEYS.indexOf(k) * 3 + 1) % SCOL.length];

const ERAS = [
  { n:'Rice, metal, walls',  yrs:'9th c. BCE–3rd c. CE', plate:'LOCAL COMMUNITIES', cap:'Rice, iron and ditches: a strong start location, but unlocked is not adopted.' },
  { n:'Court levels up',     yrs:'3rd–8th c.',           plate:'YAMATO RULERS → THE COURT', cap:'The court copies the strongest player on the map, and the upkeep gets brutal.' },
  { n:'Two controllers',     yrs:'12th–14th c.',         plate:'KAMAKURA WARRIOR GOVERNMENT', cap:'Two controllers, one map, and a reward-land bottleneck.' },
  { n:'Free-for-all',        yrs:'1467–1600',            plate:'DOZENS OF LORDS', cap:'Guns spike the lords who can afford them, then the map is pulled back together.' },
  { n:'Locking the board',   yrs:'1600–1850s',           plate:'TOKUGAWA SHOGUNATE', cap:'New win condition: stay in charge. The lords pay upkeep on purpose.' },
  { n:'The speedrun',        yrs:'1853–1911',            plate:'MEIJI OLIGARCHS', cap:'A full tech switch, and someone has to pay for the speedrun.' },
  { n:'Total war',           yrs:'1931–1945',            plate:'GAME LAYER OFF', cap:'The game layer comes off. No metaphor fits these years.' },
  { n:'Rebuild',             yrs:'1945–2025',            plate:'OCCUPATION → ELECTED GOVERNMENTS', cap:'Game layer back on, carefully: a snowball, two bottlenecks, and fewer hands.' },
];
const DUR = T0 + ESEC * 8 + 5;

/* n: id, e = era, r = row, l = label, yr, terms, text, from = parents, df = dashed parents,
   dashed = uncertain/debated, replay, note, beat, age */
const NODES = [

const BY = {}; NODES.forEach(n => { BY[n.id] = n; n.x = colX(n.e); n.y = Y0 + n.r * RH; });
ERAS.forEach((e, i) => { e.t0 = T0 + i * ESEC; const L = NODES.filter(n => n.e === i).sort((a, b) => a.r - b.r); L.forEach((n, k) => { n.tu = e.t0 + .5 + k * (4 / Math.max(1, L.length)); }); });

/* ---------- drawing ---------- */
const bz = (p0, c1, c2, p3, u) => { const m = 1 - u; return [m*m*m*p0[0] + 3*m*m*u*c1[0] + 3*m*u*u*c2[0] + u*u*u*p3[0], m*m*m*p0[1] + 3*m*m*u*c1[1] + 3*m*u*u*c2[1] + u*u*u*p3[1]]; };
function wrap(s, maxW, size, bold){
  const out = []; let cur = '';
  for (const w of s.split(' ')){ const t = cur ? cur + ' ' + w : w; if (txtW(t, size, bold) > maxW && cur){ out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur); return out;
}
function fitTxt(s, x, y, size, c, maxW, bold){ const w = txtW(s, size, bold); txt(s, x, y, w > maxW ? size * maxW / w : size, c, 'center', bold); }
let HIT = [], hover = null, sel = null, wasPlaying = true;

function edge(a, b, t, dashed){
  const u = seg(t, Math.max(a.tu, b.tu), Math.max(a.tu, b.tu) + .5); if (u <= 0) return;
  let pts;
  if (a.e === b.e){
    if (b.r - a.r === 1) pts = [[a.x, a.y + NH / 2], [b.x, b.y - NH / 2]];
    else { const lx = a.x - NW / 2, tx = lx - 10; pts = [[lx, a.y], [tx, a.y + 5], [tx, b.y - 5], [lx, b.y]]; }
  } else {
    const p0 = [a.x + NW / 2, a.y], p3 = [b.x - NW / 2, b.y]; pts = [];
    for (let k = 0; k <= 14; k++) pts.push(bz(p0, [p0[0] + 45, p0[1]], [p3[0] - 45, p3[1]], p3, k / 14));
  }
  const n = pts.length, e = pts[n - 1], q = pts[n - 2], ang = Math.atan2(e[1] - q[1], e[0] - q[0]);
  withA(u, () => {
    poly(pts, { stroke:dashed ? P.inkSoft : P.ink, w:2, amp:.5, seg:50, dash:dashed ? [6, 5] : undefined });
    line(e[0], e[1], e[0] - Math.cos(ang - .5) * 9, e[1] - Math.sin(ang - .5) * 9, dashed ? P.inkSoft : P.ink, 2);
    line(e[0], e[1], e[0] - Math.cos(ang + .5) * 9, e[1] - Math.sin(ang + .5) * 9, dashed ? P.inkSoft : P.ink, 2);
  });
}
function node(n, t){
  const u = seg(t, n.tu, n.tu + .45), locked = u <= 0, hv = hover === n.id;
  HIT.push({ id:n.id, x:n.x - NW / 2, y:n.y - NH / 2, w:NW, h:NH });
  ctx.save(); ctx.translate(n.x, n.y);
  const sc = (locked ? 1 : Math.max(.05, back(u))) * (hv ? 1.05 : 1); ctx.scale(sc, sc);
  withA(locked ? .22 : 1, () => {
    rect(-NW / 2, -NH / 2, NW, NH, { fill:locked ? '#fff' : SCOL[n.e], r:10, w:hv ? 3.2 : 2.2, dash:(n.dashed || locked) ? [6, 4] : undefined });
    const ls = n.l.split('\n');
    ls.forEach((s, i) => fitTxt(s, 0, ls.length === 1 ? 1 : (i ? 9 : -9), 14, P.ink, NW - 14, true));

}

    if (act) rect(x + 3, 80, CW - 6, 516, { fill:null, stroke:SCOL[i], r:14, w:3 });
    circ(x + 20, 96, 12, { fill:SCOL[i], w:2 }); txt(String(i + 1), x + 20, 97, 14, P.ink, 'center', true);

function toast(t){
  for (const n of NODES) if (n.age && t > n.tu && t < n.tu + 2){
    const u = seg(t, n.tu, n.tu + .3) * (1 - seg(t, n.tu + 1.5, n.tu + 2)), s = 'AGE ADVANCED  ·  ' + n.age;
    withA(u, () => { const w = txtW(s, 22, true) + 50; rect(W / 2 - w / 2, 150 + (1 - u) * -10, w, 44, { fill:P.yellow, r:22, w:2.6 }); txt(s, W / 2, 173 - (1 - u) * 10, 22, P.ink, 'center', true); });

function chrome(t){
  txt('Japan: The Long Campaign', 24, 34, 28, P.ink, 'left', true);
  const w = txtW('Japan: The Long Campaign', 28, true); poly([[24, 54], [24 + w * .5, 57], [24 + w, 54]], { stroke:P.yellow, w:4.5, amp:.4, seg:80 });
  txt('tech tree · draft · facts from the script, unchecked', W - 24, 34, 15, P.inkSoft, 'right');
  txt('Dashed = uncertain, inferred or debated   ·   coloured dot = a game term (click for its card)   ·   left off on purpose: wars, famine, colonial rule, disasters', W / 2, 606, 12, P.inkSoft);
  const k = clamp(Math.floor((t - T0) / ESEC), -1, 7), cap = t < T0 ? 'Eight eras, one map. Watch the tree unlock, then click any tech.' : t >= T0 + ESEC * 8 ? 'Click any tech to read its card  ·  space pauses  ·  1–8 jumps to an era  ·  R restarts' : ERAS[k].cap;
  const cw = txtW(cap, 19) + 44; rect(W / 2 - cw / 2, 622, cw, 42, { fill:'rgba(255,255,255,.8)', r:21, w:1.8 }); txt(cap, W / 2, 643, 19, P.ink);
  const x0 = 44, x1 = W - 190, y = 696, sw = (x1 - x0) / 8;
  for (let i = 0; i < 8; i++){
    const a = x0 + i * sw + 3, b = x0 + (i + 1) * sw - 3, f = clamp((t - T0 - i * ESEC) / ESEC);
    ctx.fillStyle = 'rgba(74,68,83,.1)'; ctx.beginPath(); ctx.roundRect(a, y - 4, b - a, 8, 4); ctx.fill();
    if (f > 0){ ctx.fillStyle = SCOL[i]; ctx.beginPath(); ctx.roundRect(a, y - 4, Math.max(8, (b - a) * f), 8, 4); ctx.fill(); }
  }
  txt(ended ? 'click to replay' : `${t.toFixed(1)}s / ${DUR}s${!playing && !sel ? ' · paused' : ''}`, W - 44, y, 15, P.inkSoft, 'right');
}
function card(n){
  ctx.fillStyle = 'rgba(74,68,83,.5)'; ctx.fillRect(0, 0, W, H);
  const e = ERAS[n.e], cw = 880, x = (W - cw) / 2, iw = cw - 70, ops = []; let y = 28;
  ops.push(['t', n.l.replace('\n', ' '), x + 35, y + 16, 32, P.ink, true]); y += 54;
  ops.push(['t', `Era ${n.e + 1} · ${e.n} · ${e.yrs}${n.yr ? ' · ' + n.yr : ''}`, x + 35, y, 16, P.inkSoft, false]); y += 26;
  ops.push(['t', 'Controller: ' + e.plate, x + 35, y, 15, P.inkSoft, true]); y += 30;
  wrap(n.text, iw, 21).forEach(s => { ops.push(['t', s, x + 35, y, 21, P.ink, false]); y += 30; }); y += 8;
  n.terms.forEach(k => {
    const cwid = txtW(k.toUpperCase(), 14, true) + 22; ops.push(['p', k.toUpperCase(), x + 35, y, cwid, tcol(k)]);
    const ls = wrap(TERMS[k], iw - cwid - 14, 17); ls.forEach((s, i) => ops.push(['t', s, x + 35 + cwid + 12, y + i * 23, 17, P.ink, false])); y += Math.max(1, ls.length) * 23 + 12;
  });
  if (n.from && n.from.length){ const s = 'Needs: ' + n.from.map(f => BY[f].l.replace('\n', ' ')).join(' + '); wrap(s, iw, 17).forEach(l => { ops.push(['t', l, x + 35, y, 17, P.ink, true]); y += 24; }); y += 6; }
  const notes = []; if (n.note) notes.push(n.note); if (n.dashed) notes.push('Dashed outline: uncertain, inferred or debated in the script.'); if (n.replay) notes.push('REPLAY: this is hindsight; nobody planned it as one move.');
  if (notes.length){ const ls = []; notes.forEach(s => wrap(s, iw - 28, 16).forEach(l => ls.push(l))); ops.push(['b', x + 25, y - 6, cw - 50, ls.length * 22 + 14]); ls.forEach((l, i) => ops.push(['t', l, x + 40, y + 8 + i * 22, 16, P.ink, false])); y += ls.length * 22 + 22; }
  ops.push(['t', `Script beat${n.beat.includes('–') ? 's' : ''} ${n.beat}   ·   click anywhere to close`, x + 35, y + 4, 14, P.inkSoft, false]); y += 32;
  const top = Math.max(16, (H - y) / 2 - 10);
  ctx.save(); ctx.translate(0, top); rect(x, 8, cw, y, { fill:'#fffdf8', r:20, w:3 }); rect(x, 8, cw, 8, { fill:SCOL[n.e], r:4, w:2 });
  ctx.translate(0, 8);
  for (const o of ops){
    if (o[0] === 't') txt(o[1], o[2], o[3], o[4], o[5], 'left', o[6]);
    else if (o[0] === 'p'){ rect(o[2], o[3] - 13, o[4], 26, { fill:o[5], r:13, w:1.8 }); txt(o[1], o[2] + o[4] / 2, o[3], 14, P.ink, 'center', true); }
    else rect(o[1], o[2], o[3], o[4], { fill:P.yellowL, r:10, w:1.6 });
  }
  ctx.restore();

/* ---------- render + playback ---------- */
let T = 0, playing = true, ended = false, last = null;
function render(t){
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.globalAlpha = 1; seed = (Math.floor(t * 8) + 1) * 7919; HIT = [];
  paper();
  for (let i = 0; i < NCOL; i++) eraHeader(i, t);
  offColumn(t);
  for (const n of NODES) for (const f of (n.from || [])) edge(BY[f], n, t, (n.df || []).includes(f));
  for (const n of NODES) node(n, t);
  toast(t); chrome(t);
  if (sel) card(BY[sel]);
}
function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1), s = Math.min(innerWidth / W, innerHeight / H) * .98;
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); K = cv.width / W;
}
function tick(now){
  if (last === null) last = now;
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (playing){ T += dt; if (T >= DUR){ T = DUR; playing = false; ended = true; } }
  render(T); requestAnimationFrame(tick);
}
function seek(t){ T = clamp(t, 0, DUR); ended = T >= DUR; if (ended) playing = false; }
function toggle(){ if (ended){ seek(0); playing = true; } else playing = !playing; }
function openCard(id){ wasPlaying = playing; playing = false; sel = id; }
function closeCard(){ sel = null; if (wasPlaying && !ended) playing = true; }
const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
const hit = (x, y) => { for (const h of HIT) if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h.id; return null; };
cv.addEventListener('pointermove', e => { const [x, y] = pos(e); hover = sel ? null : hit(x, y); cv.style.cursor = hover ? 'pointer' : 'default'; });
cv.addEventListener('click', e => { if (sel) return closeCard(); const [x, y] = pos(e), id = hit(x, y); if (id) openCard(id); else toggle(); });
addEventListener('keydown', e => {
  if (e.key === 'Escape') closeCard();
  else if (e.key === ' '){ e.preventDefault(); if (sel) closeCard(); else toggle(); }
  else if (e.key === 'ArrowRight') seek(T + 2);
  else if (e.key === 'ArrowLeft'){ seek(T - 2); ended = false; }
  else if (e.key === 'r' || e.key === 'R'){ sel = null; seek(0); playing = true; }
  else if (/^[1-8]$/.test(e.key)){ sel = null; seek(T0 + (+e.key - 1) * ESEC); ended = false; playing = true; }
});
addEventListener('resize', () => { resize(); render(T); });
const qs = new URLSearchParams(location.search), qt = parseFloat(qs.get('t'));
if (!isNaN(qt)){ seek(qt); playing = false; ended = false; }
if (qs.get('node') && BY[qs.get('node')]){ sel = qs.get('node'); playing = false; }
window.renderAt = (t, id) => { seek(t); playing = false; ended = false; sel = id && BY[id] ? id : null; render(T); };
resize(); requestAnimationFrame(tick);
