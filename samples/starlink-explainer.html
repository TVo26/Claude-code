<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How Starlink Works</title>
<style>
  html,body{margin:0;height:100%;background:#ece5da;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;border-radius:12px;box-shadow:0 12px 40px rgba(80,60,90,.18);cursor:pointer}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A 3 minute hand-drawn animation where Robo, a red square robot, explains how Starlink satellite internet works."></canvas>
<script>
'use strict';
/* =====================================================================
   How Starlink Works — a 3 minute hand-drawn canvas animation starring Robo.
   Every frame is drawn from scratch with Canvas 2D; no images, no libs.
   Controls: click / space = pause · left/right = seek 5 s · R = restart
             ?t=95 in the URL starts paused at that time (seconds)
   Sizes and speeds are simplified for teaching and are labelled on screen.
   ===================================================================== */
const W = 1280, H = 720, DUR = 180, SCENE = 15, N = 12;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let K = 1;

const P = {
  paper:'#fbf6ec', ink:'#4a4453', inkSoft:'#8a8294',
  red:'#f2837b', redD:'#d9665f', pink:'#f9c9d2', pinkL:'#fde8ec',
  blue:'#a9d6f2', blueL:'#e3f2fc', green:'#a8dca0', greenD:'#6fae73', greenL:'#e3f5df',
  yellow:'#fbe39a', yellowL:'#fff5d1', purple:'#cdb8ee', purpleL:'#efe6fb',
  orange:'#fbc79a', orangeL:'#feecdc', mint:'#aee8d6', mintL:'#e2f7f0',
  gray:'#e2dcd2', grayD:'#b1a9a0'
};
const SCOL = ['#f9b8c4','#cdb8ee','#a9d6f2','#a8dca0','#fbe39a','#fbc79a','#d9c2f0','#aee8d6','#c7e59a','#f2837b'];
const FONT = '"Comic Sans MS","Comic Neue","Chalkboard SE","Marker Felt","Segoe Print",cursive';
const MONO = '"Courier New",ui-monospace,monospace';

/* ---------- math + seeded jitter (the "boil" of a hand-drawn line) ---------- */
let seed = 1;
function R(){ seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const J = a => (R() * 2 - 1) * a;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = t => 1 - Math.pow(1 - t, 3);
const eIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const back = t => { if (t <= 0) return 0; const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const TAU = Math.PI * 2;

function withA(a, fn){ if (a <= 0) return; const g = ctx.globalAlpha; ctx.globalAlpha = g * Math.min(1, a); fn(); ctx.globalAlpha = g; }

/* ---------- sketchy primitives ---------- */
function subdiv(pts, closed, maxL){
  const out = [], n = pts.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++){
    const a = pts[i], b = pts[(i + 1) % n]; out.push(a);
    const k = Math.floor(Math.hypot(b[0] - a[0], b[1] - a[1]) / maxL);
    for (let j = 1; j <= k; j++){ const u = j / (k + 1); out.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u)]); }
  }
  if (!closed) out.push(pts[n - 1]);
  return out;
}
function trace(pts, closed, amp){
  const q = pts.map(p => [p[0] + J(amp), p[1] + J(amp)]), n = q.length;
  ctx.beginPath();
  if (closed){
    let m = [(q[n-1][0] + q[0][0]) / 2, (q[n-1][1] + q[0][1]) / 2]; ctx.moveTo(m[0], m[1]);
    for (let i = 0; i < n; i++){ const b = q[(i + 1) % n]; m = [(q[i][0] + b[0]) / 2, (q[i][1] + b[1]) / 2]; ctx.quadraticCurveTo(q[i][0], q[i][1], m[0], m[1]); }
    ctx.closePath();
  } else {
    ctx.moveTo(q[0][0], q[0][1]);
    for (let i = 1; i < n - 1; i++){ const b = q[i + 1]; ctx.quadraticCurveTo(q[i][0], q[i][1], (q[i][0] + b[0]) / 2, (q[i][1] + b[1]) / 2); }
    ctx.lineTo(q[n-1][0], q[n-1][1]);
  }
}
function bbox(pts){ let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const p of pts){ a = Math.min(a, p[0]); b = Math.min(b, p[1]); c = Math.max(c, p[0]); d = Math.max(d, p[1]); } return [a, b, c, d]; }
function hatch(x0, y0, x1, y1, c, gap = 9){
  const g = ctx.globalAlpha; ctx.globalAlpha = g * .3; ctx.strokeStyle = c; ctx.lineWidth = 1.3; ctx.beginPath();
  for (let d = x0 - (y1 - y0); d < x1; d += gap){ ctx.moveTo(d + J(1), y1 + J(1)); ctx.lineTo(d + (y1 - y0) + J(1), y0 + J(1)); }
  ctx.stroke(); ctx.globalAlpha = g;
}
function shape(pts, o = {}){
  const closed = o.closed !== false, amp = o.amp ?? 1.2, w = o.w ?? 2.2;
  if (o.fill){ ctx.fillStyle = o.fill; trace(pts, closed, amp * .4); ctx.fill(); }
  if (o.hatch){ const b = bbox(pts); ctx.save(); trace(pts, closed, 0); ctx.clip(); hatch(b[0], b[1], b[2], b[3], o.hatch, o.gap || 9); ctx.restore(); }
  if (o.stroke !== null){
    ctx.strokeStyle = o.stroke || P.ink; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (o.dash) ctx.setLineDash(o.dash);
    ctx.lineWidth = w; trace(pts, closed, amp); ctx.stroke();
    const g = ctx.globalAlpha; ctx.globalAlpha = g * .45; ctx.lineWidth = w * .6; trace(pts, closed, amp * 1.8); ctx.stroke(); ctx.globalAlpha = g;
    ctx.setLineDash([]);
  }
}
function rrPts(x, y, w, h, r){
  r = Math.max(2, Math.min(r, w / 2, h / 2)); const pts = [];
  const cs = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of cs) for (let i = 0; i <= 3; i++){ const a = a0 + i / 3 * Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return subdiv(pts, true, 55);
}
function ellPts(cx, cy, rx, ry, n){ n = n || Math.max(12, Math.min(32, Math.round((rx + ry) * .35))); const p = []; for (let i = 0; i < n; i++){ const a = i / n * TAU; p.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return p; }
const rect = (x, y, w, h, o = {}) => shape(rrPts(x, y, w, h, o.r ?? 8), o);
const circ = (cx, cy, r, o = {}) => shape(ellPts(cx, cy, r, o.ry ?? r), o);
const poly = (pts, o = {}) => shape(subdiv(pts, false, o.seg || 40), { ...o, closed:false });
function line(x1, y1, x2, y2, c = P.ink, w = 2.2){
  const len = Math.hypot(x2 - x1, y2 - y1) || 1, nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
  ctx.strokeStyle = c; ctx.lineCap = 'round'; const g = ctx.globalAlpha;
  for (let p = 0; p < 2; p++){
    ctx.lineWidth = p ? w * .55 : w; ctx.globalAlpha = p ? g * .5 : g;
    const bow = J(1) * Math.min(3, len * .03), ax = x1 + J(1), ay = y1 + J(1), bx = x2 + J(1), by = y2 + J(1);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo((ax + bx) / 2 + nx * bow, (ay + by) / 2 + ny * bow, bx, by); ctx.stroke();
  }
  ctx.globalAlpha = g;
}
function arrow(x1, y1, x2, y2, c = P.ink, w = 2.2, p = 1, dash){
  if (p <= 0) return; const ex = lerp(x1, x2, p), ey = lerp(y1, y2, p);
  poly([[x1, y1], [ex, ey]], { stroke:c, w, dash, amp:.8 });
  const a = Math.atan2(ey - y1, ex - x1), L = 12;
  line(ex, ey, ex - Math.cos(a - .45) * L, ey - Math.sin(a - .45) * L, c, w);
  line(ex, ey, ex - Math.cos(a + .45) * L, ey - Math.sin(a + .45) * L, c, w);
}
function txt(s, x, y, size = 20, c = P.ink, align = 'center', bold = false, font = FONT){
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${font}`; ctx.fillStyle = c; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function txtW(s, size, bold = false, font = FONT){ ctx.font = `${bold ? 'bold ' : ''}${size}px ${font}`; return ctx.measureText(s).width; }
function bubble(x, y, s, tx, ty, size = 18){
  const w = txtW(s, size, true) + 30, h = size + 20;
  rect(x - w / 2, y - h / 2, w, h, { fill:'#fff', r:h / 2, w:2 });
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - 10, y + h / 2 - 4); ctx.lineTo(tx, ty); ctx.lineTo(x + 10, y + h / 2 - 4); ctx.fill();
  line(x - 10, y + h / 2 - 1, tx, ty, P.ink, 2); line(x + 10, y + h / 2 - 1, tx, ty, P.ink, 2);
  txt(s, x, y + 1, size, P.ink, 'center', true);
}
function star(cx, cy, r1, r2, n, rot, o){ const p = []; for (let i = 0; i < n * 2; i++){ const a = rot + i / (n * 2) * TAU - Math.PI / 2, r = i % 2 ? r2 : r1; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } shape(p, { amp:.6, ...o }); }
function sparkle(x, y, s, rot = 0){ star(x, y, 12 * s, 3.5 * s, 4, rot, { fill:P.yellow, w:1.6 }); }
function gear(cx, cy, r, teeth, rot, fill){
  const p = [], n = teeth * 4;
  for (let i = 0; i < n; i++){ const a = rot + i / n * TAU, rr = (i % 4 < 2) ? r : r * .78; p.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
  shape(p, { fill, w:2, amp:.5 }); circ(cx, cy, r * .3, { fill:'#fff', w:1.8 });
}
function check(x, y, s = 1){ circ(x, y, 11 * s, { fill:P.green, w:1.8 }); poly([[x - 5 * s, y], [x - 1 * s, y + 4 * s], [x + 6 * s, y - 5 * s]], { w:2.6 * s, amp:.3 }); }
function lock(x, y, s = 1){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = P.ink; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-10, -10); ctx.arc(0, -10, 10, Math.PI, 0); ctx.lineTo(10, 0); ctx.stroke();
  rect(-17, -3, 34, 27, { fill:P.yellow, r:6 }); circ(0, 8, 3.5, { fill:P.ink, w:1 }); ctx.restore();
}
function leaf(x, y, ang, sz){
  if (sz < .6) return; ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  shape(ellPts(sz * 1.2, 0, sz * 1.2, sz * .55, 10), { fill:P.green, stroke:P.greenD, w:1.5, amp:.35 });
  ctx.restore();
}

/* ---------- Robo: the cute red square robot ---------- */
function robot(x, y, s, o = {}){
  const t = o.t || 0, aL = o.aL ?? .25, aR = o.aR ?? .25, lk = o.look || [0, 0], mood = o.mood || 'happy';
  const bob = o.bounce ? -Math.abs(Math.sin(t * o.bounce)) * 9 : Math.sin(t * 3) * 1.5;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(74,68,83,.13)'; ctx.beginPath(); ctx.ellipse(0, 2, 48, 7, 0, 0, TAU); ctx.fill();
  const sw = o.walk ? Math.sin(t * 14) : 0;
  rect(-28, -24 - Math.max(0, sw) * 6, 16, 24, { fill:P.redD, r:5, w:2 });
  rect(12, -24 - Math.max(0, -sw) * 6, 16, 24, { fill:P.redD, r:5, w:2 });
  ctx.translate(0, bob);
  // antenna with glowing tip
  poly([[0, -104], [4, -113], [-4, -121], [0, -129]], { w:2.6, amp:.4, seg:100 });
  const glow = .5 + .5 * Math.sin(t * 5);
  ctx.fillStyle = `rgba(255,222,110,${.22 + .3 * glow})`; ctx.beginPath(); ctx.arc(0, -135, 14 + glow * 5, 0, TAU); ctx.fill();
  circ(0, -135, 7.5, { fill:P.yellow, w:2 });
  // body
  rect(-46, -104, 92, 84, { fill:mood === 'x' ? '#d9b3ae' : P.red, r:18, w:2.6 });
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-39, -58); ctx.quadraticCurveTo(-40, -90, -28, -96); ctx.stroke();
  // face screen
  rect(-31, -93, 62, 44, { fill:'#fff4ef', r:11, w:2 });
  const blink = (t % 3.3) < .13;
  for (const ex of [-13, 13]){
    const cx = ex + lk[0] * 3, cy = -74 + lk[1] * 2;
    if (mood === 'x'){ line(cx - 5, cy - 5, cx + 5, cy + 5, P.ink, 2.4); line(cx - 5, cy + 5, cx + 5, cy - 5, P.ink, 2.4); }
    else if (blink){ line(cx - 5, cy, cx + 5, cy, P.ink, 2.6); }
    else { ctx.fillStyle = P.ink; ctx.beginPath(); ctx.ellipse(cx, cy, 4.6, mood === 'wow' ? 6.8 : 5.6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + 1.6, cy - 2.2, 1.7, 0, TAU); ctx.fill(); }
  }
  ctx.fillStyle = 'rgba(247,150,165,.7)';
  ctx.beginPath(); ctx.ellipse(-22, -61, 5.5, 3.2, 0, 0, TAU); ctx.ellipse(22, -61, 5.5, 3.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = P.ink; ctx.lineWidth = 2.3; ctx.beginPath();
  const mx = lk[0] * 3;
  if (mood === 'wow') ctx.ellipse(mx, -59, 3.6, 4.6, 0, 0, TAU);
  else if (mood === 'sad' || mood === 'x') ctx.arc(mx, -53, 6, Math.PI * 1.15, Math.PI * 1.85);
  else ctx.arc(mx, -64, 6.5, Math.PI * .15, Math.PI * .85);
  ctx.stroke();
  circ(-15, -35, 4.2, { fill:P.yellow, w:1.6 }); circ(0, -35, 4.2, { fill:P.mint, w:1.6 }); circ(15, -35, 4.2, { fill:P.blue, w:1.6 });
  // noodle arms
  const L = 34, sL = [-45, -62], sR = [45, -62];
  const hL = [sL[0] - Math.sin(aL) * L, sL[1] + Math.cos(aL) * L], hR = [sR[0] + Math.sin(aR) * L, sR[1] + Math.cos(aR) * L];
  for (const [s0, h, d] of [[sL, hL, -1], [sR, hR, 1]]){
    poly([s0, [(s0[0] + h[0]) / 2 + d * 3, (s0[1] + h[1]) / 2 + 5], h], { w:3.4, amp:.4, seg:100 });
    circ(h[0], h[1], 7.5, { fill:P.redD, w:2 });
  }
  ctx.restore();
  const k = p => [x + p[0] * s, y + (p[1] + bob) * s];
  return { hL:k(hL), hR:k(hR) };
}

/* ---------- frame chrome: paper, stage label, caption, progress ---------- */

/* ---------- chrome: paper, part label, caption, progress ---------- */
function paper(){
  ctx.fillStyle = P.paper; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(150,185,215,.15)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let y = 100; y < H; y += 32){ ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke();
  const s0 = seed; seed = 4242; ctx.fillStyle = 'rgba(120,100,80,.08)';
  for (let i = 0; i < 280; i++) ctx.fillRect(R() * W, R() * H, 1 + R() * 1.6, 1 + R() * 1.6);
  seed = s0;
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(130,95,60,.10)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function header(i, title, lt){
  const p = back(seg(lt, 0, .45));
  ctx.save(); ctx.translate(48, 50); ctx.scale(p || .001, p || .001);
  circ(0, 0, 24, { fill:SCOL[i % 10], w:2.4 }); txt(String(i + 1), 0, 1, 24, P.ink, 'center', true);
  ctx.restore();
  txt(title, 86, 48, 30, P.ink, 'left', true);
  const w = txtW(title, 30, true), u = eOut(seg(lt, .15, .8)), pts = [];
  for (let k = 0; k <= 30; k++) pts.push([86 + w * u * k / 30, 72 + Math.sin(k * 1.4) * 2.2]);
  if (u > .01) poly(pts, { stroke:SCOL[i % 10], w:4.5, amp:.4, seg:100 });
  txt(`part ${i + 1} of ${N}`, W - 44, 50, 16, P.inkSoft, 'right');
}
function caption(s, c, L){
  withA(Math.min(seg(c, .1, .4), seg(L - c, 0, .25)), () => {
    const sz = 22; let lines = [s];
    if (txtW(s, sz, true) > 1060){
      const ws = s.split(' '); let best = 1, bd = 1e9;
      for (let k = 1; k < ws.length; k++){ const d = Math.abs(txtW(ws.slice(0, k).join(' '), sz, true) - txtW(ws.slice(k).join(' '), sz, true)); if (d < bd){ bd = d; best = k; } }
      lines = [ws.slice(0, best).join(' '), ws.slice(best).join(' ')];
    }
    const w = Math.max(...lines.map(l => txtW(l, sz, true))) + 48, h = lines.length * 30 + 18, y0 = 670 - h;
    rect(W / 2 - w / 2, y0, w, h, { fill:'rgba(255,255,255,.9)', r:Math.min(24, h / 2), w:2.2 });
    lines.forEach((l, i) => txt(l, W / 2, y0 + 9 + 15 + i * 30, sz, P.ink, 'center', true));
  });
}
function progress(T){
  const x0 = 44, x1 = W - 170, y = 696, sw = (x1 - x0) / N;
  for (let k = 0; k < N; k++){
    const a = x0 + k * sw + 3, b = x0 + (k + 1) * sw - 3, f = clamp((T - k * SCENE) / SCENE);
    ctx.fillStyle = 'rgba(74,68,83,.1)'; ctx.beginPath(); ctx.roundRect(a, y - 4, b - a, 8, 4); ctx.fill();
    if (f > 0){ ctx.fillStyle = SCOL[k % 10]; ctx.beginPath(); ctx.roundRect(a, y - 4, Math.max(8, (b - a) * f), 8, 4); ctx.fill(); }
  }
  txt(ended ? 'click to replay' : `${T.toFixed(1)}s / ${DUR}s`, W - 44, y, 15, P.inkSoft, 'right');
  if (!playing && !ended){ ctx.fillStyle = 'rgba(74,68,83,.55)'; ctx.fillRect(W - 60, 16, 6, 20); ctx.fillRect(W - 50, 16, 6, 20); }
}

/* ---------- Starlink building blocks ---------- */
let curT = 0;
const LANDS = [[.5,.5,.2],[2.1,.62,.24],[3.6,.4,.16],[4.9,.7,.22],[5.8,.3,.13],[1.2,.85,.18]];
const LANDS_CAP = [[-2.5,.93,.07],[-2.05,.95,.08],[-1.6,.94,.07],[-1.15,.95,.08],[-.7,.93,.06],[-2.85,.9,.06]];
function earth(cx, cy, Rr, cap){
  ctx.fillStyle = P.blue; ctx.beginPath(); ctx.arc(cx, cy, Rr, 0, TAU); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, Rr, 0, TAU); ctx.clip(); ctx.fillStyle = P.green;
  for (const [a, r, s] of (cap ? LANDS_CAP : LANDS)){
    ctx.beginPath(); ctx.ellipse(cx + Math.cos(a) * Rr * r, cy + Math.sin(a) * Rr * r, Rr * s, Rr * s * (cap ? .35 : .6), a + (cap ? Math.PI / 2 : 0), 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = P.ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, Rr, 0, TAU); ctx.stroke();
}
function stars(){
  const s0 = seed; seed = 1234;
  for (let i = 0; i < 28; i++){
    const x = 50 + R() * 1180, y = 110 + R() * 480, tw = .5 + .5 * Math.sin(curT * 2 + i * 1.7);
    ctx.fillStyle = `rgba(150,160,205,${.35 + .5 * tw})`; ctx.beginPath(); ctx.arc(x, y, 1.6 + tw, 0, TAU); ctx.fill();
  }
  seed = s0;
}
function space(fn){
  ctx.save(); ctx.beginPath(); ctx.roundRect(30, 96, 1220, 512, 22); ctx.fillStyle = '#dfe5fa'; ctx.fill(); ctx.clip();
  stars(); fn(); ctx.restore();
  ctx.beginPath(); ctx.roundRect(30, 96, 1220, 512, 22); ctx.strokeStyle = P.ink; ctx.lineWidth = 2.4; ctx.stroke();
}
function ground(y){
  ctx.fillStyle = P.greenL; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, y + Math.sin(x * .012) * 7);
  ctx.lineTo(W, H); ctx.fill();
  ctx.strokeStyle = P.greenD; ctx.lineWidth = 2.4; ctx.beginPath();
  for (let x = 0; x <= W; x += 20) x ? ctx.lineTo(x, y + Math.sin(x * .012) * 7) : ctx.moveTo(x, y);
  ctx.stroke();
}
function sat(x, y, s = 1, rot = 0, hi = 0){
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  if (hi){ ctx.fillStyle = `rgba(255,222,110,${.4 * hi})`; ctx.beginPath(); ctx.arc(0, 0, 32, 0, TAU); ctx.fill(); }
  rect(-28, -5, 56, 10, { fill:P.blueL, r:2, w:1.8, amp:.5 });
  line(-14, -5, -14, 5, P.inkSoft, 1.2); line(0, -5, 0, 5, P.inkSoft, 1.2); line(14, -5, 14, 5, P.inkSoft, 1.2);
  rect(-7, -9, 14, 18, { fill:P.gray, r:3, w:1.8, amp:.4 });
  ctx.restore();
}

let T = 0, playing = true, ended = false, last = null;
function render(t){
  curT = t;
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.globalAlpha = 1; seed = (Math.floor(t * 8) + 1) * 7919;
  paper();
  const i = Math.min(N - 1, Math.floor(t / SCENE)), lt = t - i * SCENE, S = SCENES[i];
  let a = Math.min(1, lt / .35); if (i < N - 1) a = Math.min(a, (SCENE - lt) / .3);
  a = clamp(a);
  ctx.globalAlpha = a; ctx.save(); const zp = 1 + .045 * (1 - seg(lt, 0, .3)); ctx.translate(W / 2, H / 2); ctx.scale(zp, zp); ctx.translate(-W / 2, -H / 2); S.d(lt); ctx.restore();
  ctx.globalAlpha = a; if (!S.hook) header(i, S.title, lt);
  const tm = S.times || S.caps.map((_, q) => q * SCENE / S.caps.length); let k = 0; tm.forEach((v, q) => { if (lt >= v) k = q; });
  caption(S.caps[k], lt - tm[k], (tm[k + 1] ?? SCENE) - tm[k]);
  ctx.globalAlpha = 1; progress(t);
}
function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1), s = Math.min(innerWidth / W, innerHeight / H) * .98;
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); K = cv.width / W;
}
function tick(now){
  if (last === null) last = now;
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (playing){ T += dt; if (T >= DUR){ T = DUR; playing = false; ended = true; } }
  render(T); requestAnimationFrame(tick);
}
function seek(t){ T = clamp(t, 0, DUR); ended = T >= DUR; if (ended) playing = false; }
function toggle(){ if (ended){ seek(0); playing = true; } else playing = !playing; }
cv.addEventListener('click', toggle);
addEventListener('keydown', e => {
  if (e.key === ' '){ e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') seek(T + 5);
  else if (e.key === 'ArrowLeft'){ seek(T - 5); ended = false; }
  else if (e.key === 'r' || e.key === 'R'){ seek(0); playing = true; }
  else if (/^[0-9]$/.test(e.key)){ seek(((+e.key + 9) % 10) * SCENE); ended = false; playing = true; }
});
addEventListener('resize', () => { resize(); render(T); });
const qt = parseFloat(new URLSearchParams(location.search).get('t'));
if (!isNaN(qt)){ seek(qt); playing = false; ended = false; }
window.renderAt = t => { seek(t); playing = false; ended = false; render(T); };
resize(); requestAnimationFrame(tick);
</script>
