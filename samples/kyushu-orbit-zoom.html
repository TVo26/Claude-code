/* clip a camera-space polygon to the near plane; each vertex keeps "real edge" flag of the edge that reaches it */

const sx = (x, z) => clamp(W / 2 + F * x / z, -30000, 30000), sy = (y, z) => clamp(H / 2 - F * y / z + 30, -30000, 30000);

/* point on the horizon circle at azimuth al, and the azimuth of a point */
const hzPt = (cm, al) => { const c = Math.cos(al), s = Math.sin(al); return [cm.Ch[0] * cm.c0 + cm.s0 * (cm.a1[0] * c + cm.a2[0] * s), cm.Ch[1] * cm.c0 + cm.s0 * (cm.a1[1] * c + cm.a2[1] * s), cm.Ch[2] * cm.c0 + cm.s0 * (cm.a1[2] * c + cm.a2[2] * s)]; };

/* ring -> { fill: Path2D, stroke: Path2D } in screen space, or null when out of sight.

function ringPaths(r, cm, wantStroke){

      const i = (s + k) % n, j = (i + 1) % n, a = U[i], b = U[j], va = dv[i] >= 0, vb = dv[j] >= 0, real = r.ef[i];

      else if (va){ const X = cross2(a, b, cm); cur.pts.push(X); cur.fl.push(real); cur.exitA = azOf(cm, X); runs.push(cur); cur = null; }
      else if (vb){ const X = cross2(b, a, cm); cur = { pts:[X, b], fl:[false, real], entA:azOf(cm, X) }; }

function layer(rings, cm, wantStroke){ const f = new Path2D(), s = wantStroke ? new Path2D() : null; let any = false;

function graticule(cm, a){

/* ---------- drawing ---------- */
const mix = (a, b, t) => { const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)), x = p(a), y = p(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], t))).join(',')})`; };

function space(){
  const g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 800); g.addColorStop(0, '#0d1633'); g.addColorStop(1, '#03040b'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

function txtBox(s, x, y, size){

function render(t){

  ctx.restore();
  ctx.save(); ctx.strokeStyle = 'rgba(190,225,255,.55)'; ctx.lineWidth = 2; ctx.stroke(S.path); ctx.restore();

  if (cap){ ctx.globalAlpha = seg(t, 14.2, 14.8); txtBox(cap, W / 2, 646, 22); ctx.globalAlpha = 1; }
  ctx.font = `13px ${FONT}`; ctx.fillStyle = 'rgba(220,230,255,.6)'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('Code-drawn globe, not satellite imagery. Map data: Natural Earth (public domain).', 24, 700);
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(24, 686, W - 48, 3); ctx.fillStyle = 'rgba(160,210,255,.9)'; ctx.fillRect(24, 686, (W - 48) * t / DUR, 3);
  ctx.textAlign = 'right'; ctx.fillText(ended ? 'click to replay' : `${t.toFixed(1)}s / ${DUR}s${playing ? '' : ' · paused'}`, W - 24, 700);
}

/* ---------- playback ---------- */
let T = 0, playing = true, ended = false, last = null;
function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1), s = Math.min(innerWidth / W, innerHeight / H) * (CLEAN ? 1 : .98);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px'; cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); K = cv.width / W;
}
function tick(now){ if (last === null) last = now; const dt = Math.min(.1, (now - last) / 1000); last = now;

function seek(t){ T = clamp(t, 0, DUR); ended = T >= DUR; if (ended) playing = false; }

addEventListener('keydown', e => { if (e.key === ' '){ e.preventDefault(); toggle(); } else if (e.key === 'ArrowRight') seek(T + 2); else if (e.key === 'ArrowLeft'){ seek(T - 2); ended = false; } else if (e.key === 'r' || e.key === 'R'){ seek(0); playing = true; } });
addEventListener('resize', () => { resize(); render(T); });
const qt = parseFloat(QS.get('t')); if (!isNaN(qt)){ seek(qt); playing = false; ended = false; }

resize(); requestAnimationFrame(tick);
</script>
