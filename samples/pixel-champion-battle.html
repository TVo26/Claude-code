   ALL CREATURES, MOVES AND TRAINERS ARE ORIGINAL AND FICTIONAL. The battle is a real simulation

   Everything is drawn in code into a 320x180 buffer and scaled up without smoothing.
   Click / space = pause. ?t=60 opens paused at 60 s. */

const clamp = (v, a = 0, z = 1) => Math.max(a, Math.min(z, v));
const lerp = (a, z, t) => a + (z - a) * t;
const seg = (t, a, z) => clamp((t - a) / (z - a));
const eOut = t => 1 - Math.pow(1 - t, 3);
const eIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const R = Math.round;
const hash = n => { n = Math.imul((n | 0) ^ 61 ^ ((n | 0) >>> 16), 9); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0) / 4294967296; };
function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ================= BATTLE DATA (all original / fictional) ================= */

// attacker type -> { defender type: multiplier }; anything missing = 1
const CHART = {

// kind: p = physical, s = special.  c = contact (the user rushes the target).  fx = which animation to play.
const MV = {

  stoneedge:{n:'Stone Edge',t:'rock',p:100,k:'p',fx:'rocks'}, quakeclaw:{n:'Quake Claw',t:'ground',p:80,k:'p',c:1,fx:'quake'},

// base = [HP, Atk, Def, SpA, SpD, Spe]; hov = hover height; m = size in metres (for the team card)
const SP = {
  gustral:{name:'Gustral',types:['normal','flying'],base:[60,85,60,75,50,125],mv:['skyslash','hypertalon','flaredive'],w:48,h:40,hov:10,m:.7},
  lumira:{name:'Lumira',types:['psychic'],base:[68,65,65,125,115,80],mv:['mindburst','frostray','sparkorb'],w:36,h:48,hov:0,m:1.6},

    mega:{name:'Mega Verdrake',types:['grass','dragon'],base:[70,110,75,145,85,145],w:60,h:62,m:1.9}},
  trilox:{name:'Trilox',types:['rock','ground'],base:[75,125,100,70,80,45],mv:['stoneedge','quakeclaw','crossclaw'],w:56,h:48,hov:0,m:1.5,shield:1},
  ironwing:{name:'Ironwing',types:['steel','flying'],base:[65,80,140,40,70,70],mv:['steelwing','windblade','stoneedge'],w:54,h:46,hov:8,m:1.7,shield:1},
  claymo:{name:'Claymo',types:['ground','psychic'],base:[60,70,105,70,120,75],mv:['mindburst','earthpower','ancientpower','selfdestruct'],w:34,h:46,hov:6,m:1.5,shield:1},
  bastigon:{name:'Bastigon',types:['steel','rock'],base:[70,110,180,60,60,50],mv:['ironslam','stoneedge','quakestomp'],w:54,h:46,hov:0,m:2.1,shield:1},
  lilorite:{name:'Lilorite',types:['rock','grass'],base:[86,81,97,81,107,43],mv:['petalburst','earthpower','ancientpower'],w:48,h:48,hov:0,m:1.5,shield:1},
  quadrex:{name:'Quadrex',types:['steel','psychic'],base:[80,135,130,95,90,70],mv:['meteorfist','mindburst','quakestomp','crossclaw'],w:60,h:48,hov:0,m:1.6,shield:1,
    mega:{name:'Mega Quadrex',types:['steel','psychic'],base:[80,145,150,105,110,110],w:70,h:56,m:2.5}},
};
const TRAINER = [{name:'Kai', title:'Challenger'}, {name:'Orin', title:'Champion'}];
const TEAMS = [['gustral','lumira','bulwhale','zephyrn','sparkhound','verdrake'], ['trilox','ironwing','claymo','bastigon','lilorite','quadrex']];
const LV = 50;
const statsOf = base => ({ a:base[1]+20, d:base[2]+20, sa:base[3]+20, sd:base[4]+20, sp:base[5]+20 });

/* ================= THE BATTLE SIMULATION (deterministic from a seed) ================= */
function simulate(seed){
  const rng = mulberry32(seed), ev = [];
  const side = TEAMS.map(ids => ids.map(id => { const d = SP[id], hp = d.base[0] + 75; return { id, hp, max:hp, st:statsOf(d.base), types:d.types.slice(), mega:false }; }));
  const act = [0, 0], vis = [false, false], mega = [false, false];
  let turn = 0, crits = 0, usedSD = 0;
  const snap = () => ({ hp:side.map(t => t.map(m => m.hp)), act:act.slice(), vis:vis.slice(), mega:mega.slice(), turn });
  const push = (o) => { o.st = snap(); ev.push(o); return o; };
  const dmgCalc = (A, D, mv, roll, crit) => {
    const P = mv.var ? Math.max(1, Math.floor(mv.p * A.hp / A.max)) : mv.p;
    const at = mv.k === 'p' ? A.st.a : A.st.sa, df = mv.k === 'p' ? D.st.d : D.st.sd;
    let d = Math.floor(Math.floor((2 * LV / 5 + 2) * P * at / df) / 50) + 2;
    if (A.types.includes(mv.t)) d = Math.floor(d * 1.5);
    d = Math.floor(d * eff(mv.t, D.types) * roll * (crit ? 1.5 : 1));
    return eff(mv.t, D.types) === 0 ? 0 : Math.max(1, d);
  };
  // each trainer's brain: pick the move that looks best right now; Self-Destruct only as a last stand
  const choose = (A, D) => {
    let best = null, bs = -1;
    for (const key of SP[A.id].mv){
      const mv = MV[key];
      if (mv.sd && A.hp > A.max * .35) continue;
      let s = Math.min(D.hp, dmgCalc(A, D, mv, .925, false)) * (1 + (rng() - .5) * .12);
      if (mv.sd) s = Math.min(D.hp, s) * 1.15;
      if (s > bs){ bs = s; best = key; }
    }
    return best;
  };
  const sendIn = (s) => { vis[s] = false; const o = push({ k:'send', side:s, idx:act[s] }); vis[s] = true; return o; };
  vis[0] = vis[1] = false; push({ k:'challenge' });
  ev.push({ k:'send2', st:snap() }); vis[0] = vis[1] = true;
  const alive = s => side[s].some(m => m.hp > 0);
  while (alive(0) && alive(1) && turn < 80){
    turn++;
    const A0 = side[0][act[0]], A1 = side[1][act[1]];
    if (act[0] === 5 && act[1] === 5 && !mega[0] && !mega[1]){
      push({ k:'mega' }); mega[0] = mega[1] = true;
      for (const s of [0, 1]){ const m = side[s][5], d = SP[m.id].mega; m.types = d.types.slice(); m.st = statsOf(d.base); m.mega = true; }
    }
    const pick = [choose(A0, A1), choose(A1, A0)];
    let order = [0, 1];
    if (A0.st.sp < A1.st.sp || (A0.st.sp === A1.st.sp && rng() < .5)) order = [1, 0];
    for (const s of order){
      const A = side[s][act[s]], t = 1 - s, D = side[t][act[t]];
      if (A.hp <= 0) continue;
      const key = pick[s], mv = MV[key];
      const crit = rng() < 1 / 12, roll = .85 + rng() * .15;
      const d = Math.min(D.hp, dmgCalc(A, D, mv, roll, crit));
      const e = eff(mv.t, D.types);
      const o = push({ k:'move', side:s, key, d, e, crit, hp1:D.hp - d, dead:D.hp - d <= 0, selfKO:!!mv.sd, nameA:A.mega ? SP[A.id].mega.name : SP[A.id].name });
      if (crit && d > 0) crits++;
      if (mv.sd) usedSD++;
      D.hp -= d; if (mv.sd) A.hp = 0;
      if (D.hp <= 0){ push({ k:'faint', side:t }); vis[t] = false; }
      if (A.hp <= 0 && mv.sd){ push({ k:'faint', side:s }); vis[s] = false; }
    }
    for (const s of [0, 1]){
      if (side[s][act[s]].hp <= 0 && alive(s)){ act[s]++; sendIn(s); }
    }
  }
  const winner = alive(0) && !alive(1) ? 0 : alive(1) && !alive(0) ? 1 : -1;
  push({ k:'end', winner });
  return { ev, winner, turns:turn, crits, usedSD, finalDuel:ev.some(e => e.k === 'mega') };
}

/* ================= TINY PIXEL RASTER (shapes -> pixels, shaded, auto-outlined) ================= */
const hex2 = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, z, k) => a.map((v, i) => Math.round(v + (z[i] - v) * k));
const pal = h => { const c = Array.isArray(h) ? h : hex2(h); return [mixc(c, [255, 255, 255], .34), c, mixc(c, [8, 8, 40], .4)]; };
const OUT = [22, 18, 44];
const pick = (p, nx, ny) => Array.isArray(p[0]) ? (ny < -.38 || (nx < -.55 && ny < .1) ? p[0] : ny > .32 ? p[2] : p[1]) : p;
class Rs {
  constructor(w, h){ this.w = w; this.h = h; this.d = new Uint8ClampedArray(w * h * 4); }
  clear(){ this.d.fill(0); }
  px(x, y, c){ x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    const i = (y * this.w + x) * 4, d = this.d; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255; }
  rect(x, y, w, h, c){ x = Math.round(x); y = Math.round(y); for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.px(x + i, y + j, Array.isArray(c[0]) ? c[1] : c); }
  ell(cx, cy, rx, ry, p){
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++){
      const nx = (x - cx) / rx, ny = (y - cy) / ry; if (nx * nx + ny * ny <= 1) this.px(x, y, pick(p, nx, ny)); }
  }
  poly(pts, p){
    let y0 = 1e9, y1 = -1e9; for (const q of pts){ y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); }
    const hh = (y1 - y0) / 2 || 1, cyy = (y0 + y1) / 2;
    for (let y = Math.ceil(y0); y <= Math.floor(y1); y++){
      const xs = [], yy = y + .01;
      for (let i = 0; i < pts.length; i++){ const a = pts[i], c = pts[(i + 1) % pts.length];
        if ((a[1] <= yy && c[1] > yy) || (c[1] <= yy && a[1] > yy)) xs.push(a[0] + (yy - a[1]) / (c[1] - a[1]) * (c[0] - a[0])); }
      xs.sort((m, n) => m - n);
      for (let i = 0; i + 1 < xs.length; i += 2) for (let x = Math.round(xs[i]); x <= Math.round(xs[i + 1]); x++) this.px(x, y, pick(p, 0, (y - cyy) / hh));
    }
  }
  line(x0, y0, x1, y1, c, th = 1){
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
    for (let i = 0; i <= n; i++){ const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n; this.rect(Math.round(x - (th - 1) / 2), Math.round(y - (th - 1) / 2), th, th, c); }
  }
  outline(col){
    const w = this.w, h = this.h, d = this.d, a = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) a[i] = d[i * 4 + 3] ? 1 : 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
      if (a[y * w + x]) continue;
      if ((x > 0 && a[y * w + x - 1]) || (x < w - 1 && a[y * w + x + 1]) || (y > 0 && a[(y - 1) * w + x]) || (y < h - 1 && a[(y + 1) * w + x])){
        const i = (y * w + x) * 4; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255; }
    }
  }
}
const SPR = {};
function spriteCanvas(key, w, h, draw, t){

const rect = (x, y, w, h, c) => { b.fillStyle = c; b.fillRect(R(x), R(y), R(w), R(h)); };
function disc(x, y, r, c){ b.fillStyle = c; x = R(x); y = R(y); for (let j = -r; j <= r; j++){ const w = Math.floor(Math.sqrt(r * r - j * j + .5)); b.fillRect(x - w, y + j, w * 2 + 1, 1); } }
function ring(x, y, r, c){ b.fillStyle = c; x = R(x); y = R(y); const n = Math.max(8, r * 6); for (let i = 0; i < n; i++){ const a = i / n * Math.PI * 2; b.fillRect(R(x + Math.cos(a) * r), R(y + Math.sin(a) * r), 1, 1); } }
function pline(x0, y0, x1, y1, c, th = 1){ b.fillStyle = c; const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)))); for (let i = 0; i <= n; i++) b.fillRect(R(x0 + (x1 - x0) * i / n - th / 2), R(y0 + (y1 - y0) * i / n - th / 2), th, th); }
function zap(x0, y0, x1, y1, seed, c, th){ let px = x0, py = y0; const n = 7; for (let i = 1; i <= n; i++){ const k = i / n, nx = lerp(x0, x1, k) + (i < n ? (hash(seed * 31 + i) - .5) * 16 : 0), ny = lerp(y0, y1, k); pline(px, py, nx, ny, c, th); px = nx; py = ny; } }
function box(x, y, w, h, fill = '#16152e', edge = '#f4f1ff'){ rect(x - 1, y - 1, w + 2, h + 2, '#050510'); rect(x, y, w, h, edge); rect(x + 1, y + 1, w - 2, h - 2, '#050510'); rect(x + 2, y + 2, w - 4, h - 4, fill); }

function dissolve(c, p){ scr.width = c.width; scr.height = c.height; scx.drawImage(c, 0, 0); const im = scx.getImageData(0, 0, c.width, c.height), d = im.data;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++){ const i = (y * c.width + x) * 4; if (d[i + 3] && hash(x * 977 + y * 131) < p){ d[i + 3] = 0; } else if (d[i + 3]){ d[i] = lerp(d[i], 255, p * .7); d[i + 1] = lerp(d[i + 1], 255, p * .7); d[i + 2] = lerp(d[i + 2], 255, p * .7); } }
  scx.putImageData(im, 0, 0); return scr; }

function buildBG(){
  const g = bg.getContext('2d');
  const rc = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  for (let y = 0; y < 144; y += 4){ const k = y / 144, c = mixc(hex2('#070b26'), hex2('#2a1f55'), k); rc(0, y, BW, 4, `rgb(${c[0]},${c[1]},${c[2]})`); }
  // back wall rocks
  for (let i = 0; i < 90; i++){ const x = hash(i * 3) * BW, y = hash(i * 3 + 1) * 120, w = 6 + hash(i * 3 + 2) * 22, h = 4 + hash(i * 7) * 10; rc(x, y, w, h, hash(i) > .5 ? '#1b1a42' : '#25215a'); }
  // side walls (jagged)
  for (let y = 0; y < 150; y += 3){ const lw = 38 + Math.sin(y * .09) * 14 + hash(y) * 8, rw = 38 + Math.cos(y * .07) * 14 + hash(y + 99) * 8;
    rc(0, y, lw, 3, y % 9 < 3 ? '#14133a' : '#1a1948'); rc(BW - rw, y, rw, 3, y % 9 < 3 ? '#14133a' : '#1a1948');
    rc(lw - 2, y, 2, 3, '#2d2a6a'); rc(BW - rw, y, 2, 3, '#2d2a6a'); }
  // stalactites
  for (let i = 0; i < 26; i++){ const x = i * 13 + hash(i) * 8, h = 8 + hash(i + 40) * 22; g.fillStyle = '#12113a'; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 9, 0); g.lineTo(x + 4.5, h); g.fill();
    g.fillStyle = '#242160'; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 3, 0); g.lineTo(x + 4.5, h); g.fill(); }
  // glowing crystals
  for (const [x, y, c] of [[34, 112, '#5ae0ff'], [48, 118, '#c88cff'], [284, 114, '#5ae0ff'], [270, 120, '#ff8cd2'], [20, 84, '#c88cff'], [300, 80, '#5ae0ff']]){
    g.fillStyle = c; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 3, y - 12); g.lineTo(x + 6, y); g.fill(); g.fillStyle = '#ffffffaa'; g.fillRect(x + 2, y - 9, 1, 6); }
  // floor: far pool + rock shelf
  rc(0, 116, BW, 28, '#2a2a66'); rc(40, 112, 240, 12, '#1d4a94'); rc(40, 112, 240, 2, '#3b7fd0');
  for (let x = 0; x < BW; x += 6){ const h = 2 + hash(x) * 3; rc(x, 124, 6, 144 - 124, hash(x + 5) > .5 ? '#34327a' : '#2c2a6c'); rc(x, 124, 6, 1, '#4a47a0'); }

}

    const e = eOut(seg(u, bt.tH, bt.tH + .55)); D.hp = lerp(st.hp[tg][st.act[tg]], bt.hp1, e); if (bt.selfKO) A.hp = lerp(st.hp[s][st.act[s]], 0, e);
    // shake
    if (mv.fx === 'quake' && q > .15 && q < .9){ shx = (Math.floor(u * 30) % 2 ? 2 : -2); shy = 0; }
    if (mv.fx === 'boom' && q > .6){ const f = 1 - seg(q, .6, 1); shx = R((hash(Math.floor(u * 40)) - .5) * 8 * f); shy = R((hash(Math.floor(u * 40) + 5) - .5) * 8 * f); }
    else if (h > 0 && h < .35 && bt.d > 0){ const amp = bt.d > hpMax(D.id) * .4 ? 2 : 1; shx = Math.floor(h * 40) % 2 ? amp : -amp; }
    if (mv.fx === 'boom') flashA = q < .5 ? 0 : q < .65 ? seg(q, .5, .65) : 1 - seg(q, .65, 1);
    if (mv.fx === 'swarm' && q > .5 && q < .75) flashA = .18 * (Math.floor(u * 30) % 2);
    if (mv.fx === 'swarm' && bt.e > 1 && false) flashA = 0;
    after = () => {
      const ac = { x:sa.x + adx, y:sa.y - sa.h * .5 + ady }, tc = { x:sd.x, y:sd.y - sd.h * .5 }, mz = { x:ac.x + dir * sa.w * .42, y:ac.y - sa.h * .08 };
      if (u > bt.tA){
        if (mv.fx === 'swarm'){
          for (let i = 0; i < 3; i++){ const kk = eIO(clamp((q - .1 - i * .05) / .45)); if (kk <= 0 || q > .6) continue;
            const lane = (i - 1) * 15; drawMon(s, A.id, A.mega, T, { dx:dir * (sd.x - sa.x) * kk * .85, dy:lane * Math.sin(kk * Math.PI), a:.8, tc:'#ffe84a', ta:.75 });
            if (kk > .1 && i < 2) zap(sa.x + dir * (sd.x - sa.x) * kk * .85, sa.y - sa.h * .5 + lane * Math.sin(kk * Math.PI), sa.x + dir * (sd.x - sa.x) * eIO(clamp((q - .1 - (i + 1) * .05) / .45)) * .85, sa.y - sa.h * .5 + (i) * 7, Math.floor(u * 24) + i, '#fff7a8', 2); }
        }
        if (mv.fx === 'boom'){ if (q > .5){ const f = seg(q, .5, .8); b.globalAlpha = 1 - seg(q, .75, 1); disc(ac.x, ac.y, R(f * 280), '#fff6d0'); disc(ac.x, ac.y, R(f * 200), '#ffb347'); b.globalAlpha = 1; burst(tc.x, tc.y, seg(q, .55, 1), '#ff9a3c'); } }
        moveFx(mv, ac, tc, mz, q, dir, T, bt);
        if (SP[D.id].shield && h > -.12 && h < .6 && bt.d >= 0 && mv.fx !== 'swarm' || (SP[D.id].shield && mv.fx === 'swarm' && h > 0 && h < .6)) shieldFx(sd.x - dir * sd.w * .42, tc.y, -dir, clamp((h + .12) / .72), sd.w > 100);
      }
    };
  }

  // ----- draw world (shaken) -----
  b.save(); b.translate(shx, shy);
  if (k === 'send' || k === 'send2' || true){ drawTrainer(0, poses[0], T, tdx[0], tdy[0]); drawTrainer(1, poses[1], T, tdx[1], tdy[1]); }
  sel.forEach(e => { if (e.show){ const sp = spot(e.s, e.id, e.mega, T); shadow(sp.x, sp.w * (e.o.sc || 1)); } });
  sel.forEach(e => { if (e.show && (k !== 'move' || e.s !== bt.side)) drawMon(e.s, e.id, e.mega, T, e.o); });
  if (k === 'move' && sel[bt.side].show) drawMon(bt.side, sel[bt.side].id, sel[bt.side].mega, T, sel[bt.side].o);
  if (after) after();
  b.restore();
  if (flashA > 0){ b.globalAlpha = clamp(flashA); rect(0, 0, BW, BH, '#ffffff'); b.globalAlpha = 1; }

  // ----- HUD + text -----
  if (k !== 'end' || u < 99){ sel.forEach(e => { if (e.hud) hud(e.s, e.id, e.mega, e.hp, st); }); }
  if (k === 'move' || k === 'send' || k === 'send2' || k === 'faint'){ const t = pxText; }
  if (k !== 'challenge' || true){ if (k !== 'end' || u < 3.5) dialog(l1, l2, p1, p2); }
  if (k === 'end'){
    veil(.68 * seg(u, 3.5, 4.3));
    if (u > 3.8){ const w = bt.winner, a = eOut(seg(u, 3.8, 4.5));
      pxText(TRAINER[w].name.toUpperCase() + ' WINS!', 160, 40 - (1 - a) * 20, w ? '#7ad6ff' : '#ffe45a', 4, 'center', '#050510');
      const nm = who(st, w).name, hp = st.hp[w][st.act[w]];
      pxText(`${nm} WON WITH ${hp} HP LEFT!`, 160, 80, '#ffffff', 1, 'center', '#050510');
      pxText(`${SIM.turns} TURNS  ${SIM.ev.filter(x => x.k === 'faint').length} KNOCKOUTS`, 160, 94, '#c9c4ff', 1, 'center', '#050510'); }
    if (u > 5.2){ box(4, 144, 312, 33); pxText('ORIGINAL FICTIONAL CREATURES. NOT POKEMON.', 160, 151, '#ffe9a8', 1, 'center'); pxText('EVERY FRAME IS DRAWN IN CODE.', 160, 163, '#ffffff', 1, 'center'); }
  }
  if (k === 'mega' && u > 3.4 && u < 4.2){ /* the Mega names appear on the HUDs */ }
}
// the HUD / dialog for the end card is drawn above; the line below is only a guard if a beat has no case
const sceneFor = { title:sceneTitle, teams:sceneTeams };

/* ================= render + playback ================= */
function render(T){
  b.imageSmoothingEnabled = false;
  const bt = beatAt(T), u = T - bt.t0;
  if (sceneFor[bt.k]) sceneFor[bt.k](T, u); else sceneBattle(T, bt, u);
  if (T < .5) veil(1 - T / .5, '0,0,0'); if (T > DUR - .6) veil((T - (DUR - .6)) / .6, '0,0,0');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, cv.width, cv.height);
  const s = cv.height / BH; ctx.fillStyle = 'rgba(0,0,0,.12)';
  for (let y = 0; y < BH; y++) ctx.fillRect(0, R(y * s + s * .75), cv.width, Math.max(1, R(s * .25)));
}
function resize(){
  const dpr = Math.min(2, devicePixelRatio || 1), k = Math.min(innerWidth / BW, innerHeight / BH) * .98;
  cv.style.width = BW * k + 'px'; cv.style.height = BH * k + 'px';
  cv.width = R(BW * k * dpr); cv.height = R(BH * k * dpr);
}
let T = 0, playing = true, last = null;
function tick(now){ if (last === null) last = now; const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (playing) T = (T + dt) % DUR; render(T); requestAnimationFrame(tick); }
cv.addEventListener('click', () => playing = !playing);
addEventListener('keydown', e => { if (e.key === ' '){ e.preventDefault(); playing = !playing; } });
addEventListener('resize', () => { resize(); render(T); });
buildBG();
const qt = parseFloat(new URLSearchParams(location.search).get('t'));
if (!isNaN(qt)){ T = clamp(qt, 0, DUR - .001); playing = false; }
window.renderAt = t => { T = t; playing = false; render(T); };
window.DUR = DUR; window.BEATS = BEATS; window.SIM = SIM;
resize(); requestAnimationFrame(tick);
</script>
