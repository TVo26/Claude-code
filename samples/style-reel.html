<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style Reel</title>
<style>
  html,body{margin:0;height:100%;background:#0d0d12;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="100 second reel of 25 code-drawn animation styles, 4 seconds each."></canvas>
<script>
'use strict';
/* 25 animation styles × 4 s = a 100 s reel. Every frame is drawn from code.
   Click / space = pause · ← → = previous / next style · ?s=7 starts at style 7 · ?t=30 opens paused at 30 s */
const W = 1280, H = 720, SEG = 4;
const cv = document.getElementById('c'); let ctx = cv.getContext('2d'); let K = 1;
const pb = document.createElement('canvas'); pb.width = 320; pb.height = 180; const b = pb.getContext('2d');

/* ================= shared helpers ================= */
const clamp = (v, a = 0, z = 1) => Math.max(a, Math.min(z, v));
const lerp = (a, z, t) => a + (z - a) * t;
const seg = (t, a, z) => clamp((t - a) / (z - a));
const eOut = t => 1 - Math.pow(1 - t, 3);
const eIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const back = t => { if (t <= 0) return 0; const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const TAU = Math.PI * 2, RD = Math.round;
const hash = (a, c = 0) => { const s = Math.sin(a * 127.1 + c * 311.7) * 43758.5453; return s - Math.floor(s); };
function noise(id, x){ const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(id, i), hash(id, i + 1), u); }
function withA(a, fn){ if (a <= 0) return; const g = ctx.globalAlpha; ctx.globalAlpha = g * Math.min(1, a); fn(); ctx.globalAlpha = g; }
function fillPoly(pts, col){ ctx.fillStyle = col; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }
function strokePoly(pts, col, w, close = false){ ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); if (close) ctx.closePath(); ctx.stroke(); }
function partial(pts, p){ if (p <= 0) return []; const n = pts.length - 1, f = p * n, k = Math.floor(f), out = pts.slice(0, k + 1);
  if (k < n){ const a = pts[k], z = pts[k + 1], u = f - k; out.push([lerp(a[0], z[0], u), lerp(a[1], z[1], u)]); } return out; }
function arcPts(cx, cy, rx, ry, a0, a1, n = 40){ const o = []; for (let i = 0; i <= n; i++){ const a = lerp(a0, a1, i / n); o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return o; }
function text(s, x, y, size, col, font, align = 'center', base = 'middle'){ const m = font.match(/^((?:bold |italic |[1-9]00 )*)(.*)$/); ctx.font = `${m[1]}${size}px ${m[2]}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y); }
const HAND = '"Comic Sans MS","Comic Neue","Chalkboard SE","Marker Felt","Segoe Print",cursive';
const SANS = '"Helvetica Neue",Helvetica,Arial,sans-serif';
const BLACK = '"Arial Black","Helvetica Neue",Impact,sans-serif';
const SERIF = 'Georgia,"Times New Roman",serif';
const MONO = '"Courier New",ui-monospace,monospace';

/* sketchy primitives (seeded "boil") */
let seed = 1;
function R(){ seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const J = a => (R() * 2 - 1) * a;
function subdiv(pts, closed, maxL){ const out = [], n = pts.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++){ const a = pts[i], z = pts[(i + 1) % n]; out.push(a); const k = Math.floor(Math.hypot(z[0] - a[0], z[1] - a[1]) / maxL);
    for (let j = 1; j <= k; j++){ const u = j / (k + 1); out.push([lerp(a[0], z[0], u), lerp(a[1], z[1], u)]); } }
  if (!closed) out.push(pts[n - 1]); return out; }
function trace(pts, closed, amp){ const q = pts.map(p => [p[0] + J(amp), p[1] + J(amp)]), n = q.length; ctx.beginPath();
  if (closed){ let m = [(q[n-1][0] + q[0][0]) / 2, (q[n-1][1] + q[0][1]) / 2]; ctx.moveTo(m[0], m[1]);
    for (let i = 0; i < n; i++){ const z = q[(i + 1) % n]; ctx.quadraticCurveTo(q[i][0], q[i][1], (q[i][0] + z[0]) / 2, (q[i][1] + z[1]) / 2); } ctx.closePath(); }
  else { ctx.moveTo(q[0][0], q[0][1]); for (let i = 1; i < n - 1; i++){ const z = q[i + 1]; ctx.quadraticCurveTo(q[i][0], q[i][1], (q[i][0] + z[0]) / 2, (q[i][1] + z[1]) / 2); } ctx.lineTo(q[n-1][0], q[n-1][1]); } }
function shape(pts, o = {}){
  const closed = o.closed !== false, amp = o.amp ?? 1.2, w = o.w ?? 2.4;
  if (o.fill){ ctx.fillStyle = o.fill; trace(pts, closed, amp * .4); ctx.fill(); }
  if (o.hatch){ let a = 1e9, c = 1e9, d = -1e9, e = -1e9; for (const p of pts){ a = Math.min(a, p[0]); c = Math.min(c, p[1]); d = Math.max(d, p[0]); e = Math.max(e, p[1]); }
    ctx.save(); trace(pts, closed, 0); ctx.clip(); const g = ctx.globalAlpha; ctx.globalAlpha = g * .3; ctx.strokeStyle = o.hatch; ctx.lineWidth = 1.4; ctx.beginPath();
    for (let x = a - (e - c); x < d; x += 9){ ctx.moveTo(x + J(1), e); ctx.lineTo(x + (e - c) + J(1), c); } ctx.stroke(); ctx.globalAlpha = g; ctx.restore(); }
  if (o.stroke !== null){ ctx.strokeStyle = o.stroke || '#4a4453'; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = w; trace(pts, closed, amp); ctx.stroke();
    const g = ctx.globalAlpha; ctx.globalAlpha = g * .45; ctx.lineWidth = w * .6; trace(pts, closed, amp * 1.8); ctx.stroke(); ctx.globalAlpha = g; }
}
function rrPts(x, y, w, h, r){ r = Math.max(2, Math.min(r, w / 2, h / 2)); const p = [];
  for (const [cx, cy, a0] of [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]])
    for (let i = 0; i <= 3; i++){ const a = a0 + i / 3 * Math.PI / 2; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return subdiv(p, true, 55); }
const srect = (x, y, w, h, o = {}) => shape(rrPts(x, y, w, h, o.r ?? 8), o);
const scirc = (cx, cy, r, o = {}) => shape(arcPts(cx, cy, r, o.ry ?? r, 0, TAU * .97, Math.max(12, Math.round(r * .4))), o);
const spoly = (pts, o = {}) => shape(subdiv(pts, false, 40), { ...o, closed:false });
function sline(x1, y1, x2, y2, c = '#4a4453', w = 2.4){ spoly([[x1, y1], [x2, y2]], { stroke:c, w, amp:1 }); }

/* ================= 1 · pastel sketch (Robo) ================= */
const PS = { ink:'#4a4453', red:'#f2837b', redD:'#d9665f', yellow:'#fbe39a', mint:'#aee8d6', blue:'#a9d6f2', paper:'#fbf6ec' };
function robot(x, y, s, o = {}){
  const t = o.t || 0, aL = o.aL ?? .25, aR = o.aR ?? .25, lk = o.look || [0, 0];
  const bob = o.bounce ? -Math.abs(Math.sin(t * o.bounce)) * 9 : Math.sin(t * 3) * 1.5;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(74,68,83,.13)'; ctx.beginPath(); ctx.ellipse(0, 2, 48, 7, 0, 0, TAU); ctx.fill();
  srect(-28, -24, 16, 24, { fill:PS.redD, r:5, w:2 }); srect(12, -24, 16, 24, { fill:PS.redD, r:5, w:2 });
  ctx.translate(0, bob);
  spoly([[0, -104], [4, -113], [-4, -121], [0, -129]], { w:2.6, amp:.4, seg:100 });
  const gl = .5 + .5 * Math.sin(t * 5); ctx.fillStyle = `rgba(255,222,110,${.25 + .3 * gl})`; ctx.beginPath(); ctx.arc(0, -135, 14 + gl * 5, 0, TAU); ctx.fill();
  scirc(0, -135, 7.5, { fill:PS.yellow, w:2 });
  srect(-46, -104, 92, 84, { fill:PS.red, r:18, w:2.6 });
  srect(-31, -93, 62, 44, { fill:'#fff4ef', r:11, w:2 });
  const blink = (t % 3.3) < .13;
  for (const ex of [-13, 13]){ const cx = ex + lk[0] * 3, cy = -74 + lk[1] * 2;
    if (blink) sline(cx - 5, cy, cx + 5, cy, PS.ink, 2.6);
    else { ctx.fillStyle = PS.ink; ctx.beginPath(); ctx.ellipse(cx, cy, 4.6, 5.6, 0, 0, TAU); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + 1.6, cy - 2.2, 1.7, 0, TAU); ctx.fill(); } }
  ctx.fillStyle = 'rgba(247,150,165,.7)'; ctx.beginPath(); ctx.ellipse(-22, -61, 5.5, 3.2, 0, 0, TAU); ctx.ellipse(22, -61, 5.5, 3.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = PS.ink; ctx.lineWidth = 2.3; ctx.beginPath(); ctx.arc(lk[0] * 3, -64, 6.5, Math.PI * .15, Math.PI * .85); ctx.stroke();
  scirc(-15, -35, 4.2, { fill:PS.yellow, w:1.6 }); scirc(0, -35, 4.2, { fill:PS.mint, w:1.6 }); scirc(15, -35, 4.2, { fill:PS.blue, w:1.6 });
  const L = 34, sL = [-45, -62], sR = [45, -62], hL = [sL[0] - Math.sin(aL) * L, sL[1] + Math.cos(aL) * L], hR = [sR[0] + Math.sin(aR) * L, sR[1] + Math.cos(aR) * L];
  for (const [s0, h, d] of [[sL, hL, -1], [sR, hR, 1]]){ spoly([s0, [(s0[0] + h[0]) / 2 + d * 3, (s0[1] + h[1]) / 2 + 5], h], { w:3.4, amp:.4, seg:100 }); scirc(h[0], h[1], 7.5, { fill:PS.redD, w:2 }); }
  ctx.restore();
}
function sbubble(x, y, s, tx, ty, size){
  ctx.font = `bold ${size}px ${HAND}`; const w = ctx.measureText(s).width + 36, h = size + 26;
  srect(x - w / 2, y - h / 2, w, h, { fill:'#fff', r:h / 2, w:2.2 });
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - 12, y + h / 2 - 4); ctx.lineTo(tx, ty); ctx.lineTo(x + 12, y + h / 2 - 4); ctx.fill();
  sline(x - 12, y + h / 2 - 1, tx, ty, PS.ink, 2.2); sline(x + 12, y + h / 2 - 1, tx, ty, PS.ink, 2.2);
  text(s, x, y + 1, size, PS.ink, 'bold ' + HAND);
}
function s01(t){
  ctx.fillStyle = PS.paper; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(150,185,215,.2)'; ctx.lineWidth = 1; ctx.beginPath(); for (let y = 40; y < H; y += 32){ ctx.moveTo(0, y); ctx.lineTo(W, y); } ctx.stroke();
  ctx.strokeStyle = 'rgba(240,140,150,.4)'; ctx.beginPath(); ctx.moveTo(96, 0); ctx.lineTo(96, H); ctx.stroke();
  robot(400, 600, 1.8, { t, aR:t > .3 ? 2.4 + .35 * Math.sin(t * 10) : .3, aL:.3, look:[.7, -.4], bounce:t > 3 ? 9 : 0 });
  if (t > .5) withA(seg(t, .5, .8), () => sbubble(420, 205, "Hi, I'm Robo!", 420, 258, 28));
  const cx = 900, cy = 290, r = 95, p = eOut(seg(t, 1.0, 2.1)), pts = arcPts(cx, cy, r, r, Math.PI * .66, Math.PI * 2.34, 40);
  if (p >= 1){ scirc(cx, cy, r - 4, { fill:'#fff3b0', hatch:'#f5c542', stroke:null });
    spoly([[cx - 42, cy + 78], [cx - 34, cy + 140]], { w:2.6 }); spoly([[cx + 42, cy + 78], [cx + 34, cy + 140]], { w:2.6 });
    srect(cx - 36, cy + 140, 72, 36, { fill:'#e2dcd2', r:8 }); sline(cx - 34, cy + 152, cx + 34, cy + 152); sline(cx - 34, cy + 164, cx + 34, cy + 164);
    spoly([[cx - 22, cy + 70], [cx - 14, cy + 10], [cx - 4, cy + 30], [cx + 6, cy + 10], [cx + 14, cy + 30], [cx + 22, cy + 70]], { w:2.2, stroke:'#e0973a' }); }
  if (p > 0) spoly(partial(pts, p), { w:3 });
  for (let k = 0; k < 7; k++){ const a = -Math.PI + (k + .5) / 7 * Math.PI, q = back(seg(t, 2.1 + k * .06, 2.4 + k * .06)); if (q <= 0) continue;
    sline(cx + Math.cos(a) * (r + 20), cy + Math.sin(a) * (r + 20), cx + Math.cos(a) * (r + 20 + 36 * q), cy + Math.sin(a) * (r + 20 + 36 * q), '#e0973a', 3.4); }
  if (t > 2.8) withA(seg(t, 2.8, 3.1), () => text('big idea!', 900, 560, 40, PS.ink, 'bold ' + HAND));
}

/* ================= 2 · whiteboard ================= */
const WB = (() => {
  const cx = 360, cy = 300, r = 110, items = [];
  items.push({ pts:arcPts(cx, cy, r, r, Math.PI * .62, Math.PI * 2.38, 50), t0:.1, t1:1.0 });
  items.push({ pts:[[cx - 42, cy + 100], [cx - 34, cy + 165], [cx + 34, cy + 165], [cx + 42, cy + 100]], t0:1.0, t1:1.25 });
  items.push({ pts:[[cx - 34, cy + 185], [cx + 34, cy + 185]], t0:1.25, t1:1.32 });
  items.push({ pts:[[cx - 22, cy + 205], [cx + 22, cy + 205]], t0:1.32, t1:1.38 });
  items.push({ pts:[[cx - 26, cy + 95], [cx - 16, cy + 20], [cx - 6, cy + 45], [cx + 4, cy + 20], [cx + 14, cy + 45], [cx + 26, cy + 95]], t0:1.38, t1:1.55 });
  for (let k = 0; k < 5; k++){ const a = -Math.PI * .9 + k / 4 * Math.PI * .8; items.push({ pts:[[cx + Math.cos(a) * (r + 22), cy + Math.sin(a) * (r + 22)], [cx + Math.cos(a) * (r + 58), cy + Math.sin(a) * (r + 58)]], t0:1.55 + k * .07, t1:1.6 + k * .07 }); }
  items.push({ txt:'BIG IDEA', x:560, y:300, size:120, t0:1.95, t1:2.8 });
  const arr = []; for (let i = 0; i <= 20; i++){ const u = i / 20; arr.push([lerp(620, 900, u), 400 + Math.sin(u * Math.PI) * 110]); }
  items.push({ pts:arr, t0:2.8, t1:3.15 }); items.push({ pts:[[872, 480], [900, 500], [906, 466]], t0:3.15, t1:3.25 });
  items.push({ txt:'ship it!', x:930, y:520, size:72, t0:3.25, t1:3.85 });
  return items;
})();
function hand(x, y){
  ctx.save(); ctx.translate(x, y); ctx.rotate(.55);
  fillPoly([[0, 0], [16, -6], [16, 6]], '#222'); ctx.fillStyle = '#2d2d2d'; ctx.fillRect(16, -10, 110, 20); ctx.fillStyle = '#2b6cb0'; ctx.fillRect(96, -10, 30, 20);
  ctx.fillStyle = '#f2c29b'; ctx.strokeStyle = '#c98f67'; ctx.lineWidth = 2;
  for (const [ex, ey, rx, ry] of [[70, 26, 40, 30], [40, 12, 16, 11], [44, -14, 16, 10], [74, -16, 22, 12]]){ ctx.beginPath(); ctx.ellipse(ex, ey, rx, ry, 0, 0, TAU); ctx.fill(); ctx.stroke(); }
  ctx.restore();
}
function s02(t){
  ctx.fillStyle = '#fbfbf7'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,.035)'; for (let i = 0; i < 6; i++) ctx.fillRect(hash(i, 1) * W, hash(i, 2) * H, 200 + hash(i, 3) * 300, 2);
  ctx.strokeStyle = '#c9ccd1'; ctx.lineWidth = 14; ctx.strokeRect(7, 7, W - 14, H - 14);
  let tip = null;
  for (const it of WB){
    const p = seg(t, it.t0, it.t1); if (p <= 0) continue;
    if (it.pts){ const pp = partial(it.pts, p); strokePoly(pp, '#1b1b1b', 6); if (p < 1) tip = pp[pp.length - 1]; }
    else { ctx.save(); ctx.font = `bold ${it.size}px ${HAND}`; const w = ctx.measureText(it.txt).width; ctx.beginPath(); ctx.rect(it.x - 10, it.y - it.size, (w + 20) * p, it.size * 2); ctx.clip();
      text(it.txt, it.x, it.y, it.size, '#1b1b1b', 'bold ' + HAND, 'left'); ctx.restore(); if (p < 1) tip = [it.x + w * p, it.y + it.size * .25 + Math.sin(t * 40) * 10]; }
  }
  if (!tip) tip = t < .1 ? [470, 190] : [1100, 640];
  hand(tip[0], tip[1]);
}

/* ================= 3 · chalkboard ================= */
function chalk(pts, p, col, w = 4){
  const pp = partial(pts, p); if (pp.length < 2) return;
  for (let k = 0; k < 3; k++){ ctx.save(); ctx.globalAlpha *= .5; ctx.setLineDash([7 + k * 3, 2 + k, 3, 1.5]); ctx.lineDashOffset = k * 5;
    ctx.translate(hash(k, 4) * 2 - 1, hash(k, 5) * 2 - 1); strokePoly(pp, col, w - k * .8); ctx.restore(); }
}
function chalkText(s, x, y, size, col, p, id){
  ctx.save(); ctx.font = `${size}px ${HAND}`; const w = ctx.measureText(s).width; ctx.beginPath(); ctx.rect(x - 5, y - size, (w + 10) * p, size * 2); ctx.clip();
  ctx.globalAlpha *= .88; text(s, x, y, size, col, HAND, 'left'); ctx.fillStyle = '#2f4a3a';
  for (let i = 0; i < 420; i++) ctx.fillRect(x + hash(i, id) * w, y - size * .5 + hash(i, id + 1) * size, 1.6, 1.6);
  ctx.restore();
}
function s03(t){
  ctx.fillStyle = '#2f4a3a'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 40; i++){ ctx.fillStyle = `rgba(255,255,255,${.015 + hash(i, 8) * .03})`; ctx.beginPath(); ctx.ellipse(hash(i, 9) * W, hash(i, 10) * H, 80 + hash(i, 11) * 160, 20 + hash(i, 12) * 40, hash(i, 13) * 3, 0, TAU); ctx.fill(); }
  ctx.strokeStyle = '#8a5a34'; ctx.lineWidth = 26; ctx.strokeRect(13, 13, W - 26, H - 26); ctx.strokeStyle = '#6d4526'; ctx.lineWidth = 4; ctx.strokeRect(26, 26, W - 52, H - 52);
  ctx.fillStyle = '#7a4d2c'; ctx.fillRect(300, H - 40, 680, 16); ctx.fillStyle = '#f4f1e8'; ctx.fillRect(420, H - 50, 46, 12); ctx.fillStyle = '#f7b6c2'; ctx.fillRect(500, H - 50, 36, 12);
  const A = [250, 520], B = [620, 520], C = [250, 220], chalkW = '#f4f1e8';
  chalk([A, B], seg(t, .1, .45), chalkW); chalk([B, C], seg(t, .45, .85), chalkW); chalk([C, A], seg(t, .85, 1.15), chalkW);
  chalk([[250, 490], [280, 490], [280, 520]], seg(t, 1.15, 1.3), chalkW, 3);
  withA(seg(t, 1.25, 1.5), () => { chalkText('a', 205, 370, 44, chalkW, 1, 20); chalkText('b', 420, 568, 44, chalkW, 1, 22); chalkText('c', 452, 345, 44, chalkW, 1, 24); });
  chalkText('a² + b² = c²', 700, 330, 84, chalkW, seg(t, 1.5, 2.6), 30);
  const ul = []; for (let i = 0; i <= 20; i++) ul.push([lerp(700, 1150, i / 20), 395 + Math.sin(i * .9) * 3]);
  chalk(ul, seg(t, 2.6, 2.95), '#fbe39a', 5);
  chalkText('Pythagoras', 760, 470, 48, '#f7b6c2', seg(t, 2.95, 3.6), 40);
  const ring = arcPts(620, 520, 34, 30, 0, TAU * 1.05, 30); chalk(ring, seg(t, 3.5, 3.9), '#fbe39a', 3);
}

/* ================= 4 · 3Blue1Brown-style math ================= */
function s04(t){
  ctx.fillStyle = '#0f1117'; ctx.fillRect(0, 0, W, H);
  const ox = 480, oy = 380, sx = 700 / TAU, r = 120, cx = 270, cy = 380;
  ctx.strokeStyle = 'rgba(88,196,221,.09)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = ox; x <= ox + 700; x += 43.75){ ctx.moveTo(x, 200); ctx.lineTo(x, 560); } for (let y = 200; y <= 560; y += 60){ ctx.moveTo(ox, y); ctx.lineTo(ox + 720, y); } ctx.stroke();
  strokePoly([[ox - 10, oy], [ox + 720, oy]], '#8b8f99', 2); strokePoly([[ox, 220], [ox, 540]], '#8b8f99', 2);
  strokePoly([[cx - 160, cy], [cx + 160, cy]], '#555a66', 1.5); strokePoly([[cx, cy - 160], [cx, cy + 160]], '#555a66', 1.5);
  ctx.strokeStyle = '#d0d3da'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
  ['π/2', 'π', '3π/2', '2π'].forEach((l, i) => { const x = ox + (i + 1) * Math.PI / 2 * sx; strokePoly([[x, oy - 7], [x, oy + 7]], '#8b8f99', 2); text(l, x, oy + 28, 22, '#c9ccd4', 'italic ' + SERIF); });
  const th = TAU * eIO(seg(t, .3, 3.5)), px = cx + Math.cos(th) * r, py = cy - Math.sin(th) * r, hx = ox + th * sx;
  ctx.save(); ctx.shadowColor = '#58c4dd'; ctx.shadowBlur = 14; const cp = []; for (let i = 0; i <= 160; i++){ const f = th * i / 160; cp.push([ox + f * sx, oy - Math.sin(f) * r]); }
  strokePoly(cp, '#58c4dd', 4); ctx.restore();
  ctx.save(); ctx.setLineDash([6, 6]); strokePoly([[px, py], [hx, py]], 'rgba(255,255,255,.35)', 1.5); ctx.restore();

  if (d === 0 || len < 4) return; const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
  ctx.lineWidth = d * 2.2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke();
  branch(x2, y2, len * (.68 + hash(id, 1) * .12), ang - .35 - hash(id, 2) * .25, d - 1, id * 2 + 1);
  branch(x2, y2, len * (.68 + hash(id, 3) * .12), ang + .3 + hash(id, 4) * .25, d - 1, id * 2 + 2);
}
function s22(t){
  const g = ctx.createRadialGradient(640, 330, 30, 640, 360, 760); g.addColorStop(0, '#ffe39a'); g.addColorStop(.45, '#ff9f45'); g.addColorStop(1, '#8e1f1b'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,250,220,.55)'; ctx.beginPath(); ctx.arc(900, 190, 60, 0, TAU); ctx.fill();
  ctx.fillStyle = '#120806'; ctx.strokeStyle = '#120806'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, H); for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 590 - 30 * Math.sin(x * .004) - (hash(x, 2) * 10)); ctx.lineTo(W, H); ctx.fill();
  for (let x = 10; x < W; x += 26){ const h = 10 + hash(x, 3) * 18; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, 594 - 30 * Math.sin(x * .004)); ctx.lineTo(x + 5, 594 - 30 * Math.sin(x * .004) - h); ctx.stroke(); }
  ctx.save(); ctx.translate(230, 590); ctx.rotate(Math.sin(t * 1.2) * .01); branch(0, 0, 130, -Math.PI / 2, 8, 1); ctx.restore();
  const bx = lerp(1350, 260, (t / 4)), by = 260 + Math.sin(t * 3) * 30, fl = Math.sin(t * 14);
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(bx, by + 10); ctx.lineTo(bx + 40, H); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(bx, by, 48, 16, -.1, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(bx - 48, by - 10, 14, 0, TAU); ctx.fill(); fillPoly([[bx - 60, by - 10], [bx - 80, by - 4], [bx - 60, by - 2]], '#120806');
  fillPoly([[bx + 40, by], [bx + 80, by - 22], [bx + 76, by + 10]], '#120806');
  fillPoly([[bx - 10, by - 6], [bx + 20, by - 6], [bx + 40, by - 90 * fl], [bx - 30, by - 70 * fl]], '#120806');
  const hp = (t * 1.6) % 1, rx = lerp(560, 980, (t / 4)), ry = 560 - Math.abs(Math.sin(hp * Math.PI)) * 70;
  ctx.beginPath(); ctx.ellipse(rx, ry, 36, 24, 0, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(rx + 32, ry - 20, 16, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(rx + 30, ry - 56, 6, 24, -.2, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.ellipse(rx + 42, ry - 54, 6, 22, .25, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(rx - 36, ry - 6, 9, 0, TAU); ctx.fill();
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(rx, ry + 20); ctx.lineTo(rx - 10, H); ctx.stroke();
  const v = ctx.createRadialGradient(640, 360, 300, 640, 360, 780); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

/* ================= 23 · watercolour ================= */
function wc(id, cx, cy, rx, ry, col, grow, layers = 10){
  if (grow <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'multiply';
  for (let L = 0; L < layers; L++){ ctx.fillStyle = col; ctx.globalAlpha = .09; ctx.beginPath();
    for (let i = 0; i < 36; i++){ const a = i / 36 * TAU, r = grow * (.82 + .3 * noise(id * 7 + L, i * .45 + L)); ctx.lineTo(cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r); } ctx.closePath(); ctx.fill();
    ctx.globalAlpha = .05; ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.restore();
}
function s23(t){
  ctx.fillStyle = '#fbf8f1'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(160,140,110,.05)'; for (let i = 0; i < 900; i++) ctx.fillRect(hash(i, 31) * W, hash(i, 32) * H, 2, 2);
  wc(1, 640, 150, 760, 230, '#a9d0ea', eOut(seg(t, 0, 1.2)), 7);
  
  { const g = eOut(seg(t, .4, 1.3)); if (g > 0){ ctx.save(); ctx.globalAlpha = .75; for (let L = 0; L < 8; L++){ ctx.fillStyle = `rgba(245,160,80,.14)`; ctx.beginPath(); for (let i = 0; i < 30; i++){ const a = i / 30 * TAU, r = 70 * g * (.85 + .25 * noise(90 + L, i * .5)); ctx.lineTo(980 + Math.cos(a) * r, 170 + Math.sin(a) * r); } ctx.fill(); } ctx.restore(); } }
  wc(3, 350, 520, 520, 170, '#b3dba8', eOut(seg(t, .6, 1.6)), 8);
  wc(4, 950, 560, 560, 150, '#8cc49a', eOut(seg(t, .8, 1.8)), 8);
  wc(5, 640, 690, 800, 90, '#9cc7e0', eOut(seg(t, 1.0, 1.9)), 7);
  wc(6, 560, 420, 70, 60, '#f2e3c6', eOut(seg(t, 1.3, 1.9)), 8); wc(7, 560, 360, 90, 40, '#d9534f', eOut(seg(t, 1.4, 2.0)), 10);
  const ink = (pts, p) => { const pp = partial(pts, p); if (pp.length > 1) strokePoly(pp, 'rgba(60,50,45,.8)', 2); };
  ink([[480, 480], [480, 390], [640, 390], [640, 480]], seg(t, 2.0, 2.5)); ink([[460, 392], [560, 325], [660, 392]], seg(t, 2.3, 2.7)); ink([[545, 480], [545, 435], [575, 435], [575, 480]], seg(t, 2.6, 2.9));
  const hill = []; for (let i = 0; i <= 30; i++) hill.push([i * 24 - 40, 470 - Math.sin(i * .3) * 50 + 20]); ink(hill, seg(t, 2.4, 3.3));
  for (let k = 0; k < 3; k++){ const x = 760 + k * 60, y = 260 + (k % 2) * 20; ink([[x - 14, y - 4], [x, y + 4], [x + 14, y - 4]], seg(t, 3.0 + k * .15, 3.3 + k * .15)); }
}

/* ================= 24 · ink / sumi-e brush ================= */
function crSample(c, n){ const out = []; for (let i = 0; i < c.length - 1; i++){ const p0 = c[Math.max(0, i - 1)], p1 = c[i], p2 = c[i + 1], p3 = c[Math.min(c.length - 1, i + 2)], st = Math.ceil(n / (c.length - 1));
  for (let s = 0; s < st; s++){ const u = s / st, u2 = u * u, u3 = u2 * u; out.push([0, 1].map(k => .5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * u + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * u2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * u3))); } }
  out.push(c[c.length - 1]); return out; }
function brush(id, ctrl, p, w, o = {}){
  if (p <= 0) return; const pts = crSample(ctrl, o.n || 60), N = pts.length - 1, m = Math.max(1, Math.floor(clamp(p) * N)), dry = o.dry ?? .75, tin = o.tin ?? .08, tout = o.tout ?? .3, a = o.a ?? .9, nor = [], wid = [];
  for (let i = 0; i <= m; i++){ const q0 = pts[Math.max(0, i - 1)], q1 = pts[Math.min(N, i + 1)], dx = q1[0] - q0[0], dy = q1[1] - q0[1], l = Math.hypot(dx, dy) || 1; nor.push([-dy / l, dx / l]); const u = i / N;
    const ti = Math.pow(Math.sin(Math.min(1, u / tin) * Math.PI / 2), .7), to = u > 1 - tout ? Math.pow((1 - u) / tout, .55) : 1; wid.push(w * Math.max(.08, ti * to) * (.82 + .36 * noise(id, u * 9))); }
  const be = Math.min(m, Math.floor(dry * N));
  if (be > 1){ ctx.fillStyle = `rgba(26,23,22,${a})`; ctx.beginPath(); for (let i = 0; i <= be; i++) ctx.lineTo(pts[i][0] + nor[i][0] * wid[i] / 2, pts[i][1] + nor[i][1] * wid[i] / 2); for (let i = be; i >= 0; i--) ctx.lineTo(pts[i][0] - nor[i][0] * wid[i] / 2, pts[i][1] - nor[i][1] * wid[i] / 2); ctx.fill(); }
  const B = Math.max(5, Math.min(14, Math.round(w / 2.2))); ctx.lineCap = 'round';
  for (let k = 0; k < B; k++){ const off = (k / (B - 1) - .5) * .95; ctx.lineWidth = Math.max(.7, w / B * 1.25); ctx.strokeStyle = `rgba(26,23,22,${a * (.55 + .4 * hash(id, k))})`; ctx.beginPath(); let dn = false;
    for (let i = 0; i <= m; i++){ const u = i / N, da = u < dry ? .04 : lerp(.15, .85, (u - dry) / (1 - dry)), x = pts[i][0] + nor[i][0] * off * wid[i], y = pts[i][1] + nor[i][1] * off * wid[i];
      if (noise(id * 13 + k * 7, u * 14) > da){ dn ? ctx.lineTo(x, y) : ctx.moveTo(x, y); dn = true; } else dn = false; } ctx.stroke(); }
}
function s24(t){
  ctx.fillStyle = '#f2ead9'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 700; i++){ ctx.strokeStyle = `rgba(150,120,80,${.05 + hash(i, 5) * .06})`; ctx.lineWidth = .6; const x = hash(i, 1) * W, y = hash(i, 2) * H, a = hash(i, 3) * TAU; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * 14, y + Math.sin(a) * 14); ctx.stroke(); }
  const stalks = [[700, 30, 10, 0], [800, 18, 5, .5]];
  stalks.forEach(([x, w, lean, d]) => { for (let s = 0; s < 4; s++){ const y0 = 690 - s * 150, y1 = y0 - 140; brush(100 + s + x, [[x + s * lean, y0], [x + s * lean + lean / 2, (y0 + y1) / 2], [x + (s + 1) * lean, y1]], eOut(seg(t, d + s * .3, d + s * .3 + .3)), w, { dry:.85, tin:.02, tout:.06, a:.85 }); } });
  const leaves = [[[712, 250], [800, 205], [900, 215]], [[712, 262], [780, 290], [860, 330]], [[808, 170], [880, 120], [960, 110]], [[808, 180], [760, 150], [700, 150]], [[705, 400], [620, 380], [560, 400]], [[806, 320], [880, 340], [940, 380]]];
  leaves.forEach((c, i) => brush(200 + i, c, eOut(seg(t, 1.5 + i * .2, 1.9 + i * .2)), 22, { dry:.7, tin:.25, tout:.6, a:.88 }));
  ctx.font = `italic 44px ${SERIF}`; ctx.fillStyle = `rgba(26,23,22,${seg(t, .6, 1.4)})`; ctx.textAlign = 'left'; ctx.fillText('Bamboo', 200, 300);
  ctx.font = `17px ${SERIF}`; ctx.fillStyle = `rgba(26,23,22,${seg(t, 1, 1.8) * .6})`; ctx.fillText('bends in the wind, does not break', 202, 340);
  const sp = seg(t, 3.1, 3.4); if (sp > 0){ ctx.save(); ctx.translate(1010, 560); ctx.globalAlpha = sp; ctx.scale(lerp(1.3, 1, eOut(sp)), lerp(1.3, 1, eOut(sp))); ctx.fillStyle = '#b8322a'; ctx.fillRect(-26, -26, 52, 52);
    ctx.strokeStyle = '#f2ead9'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-12, -14); ctx.lineTo(-12, 14); ctx.moveTo(12, -14); ctx.lineTo(12, 14); ctx.moveTo(-16, 0); ctx.lineTo(16, 0); ctx.stroke(); ctx.restore(); }
}

/* ================= 25 · geometric abstract ================= */
function s25(t){
  ctx.fillStyle = '#f2eee3'; ctx.fillRect(0, 0, W, H);
  const beat = Math.pow(1 - (t * 2) % 1, 3), sw = eIO(seg(t, 1.8, 2.4));
  ctx.fillStyle = '#1b1b1b'; for (let y = 60; y < H; y += 40) for (let x = 60; x < 360; x += 40){ ctx.beginPath(); ctx.arc(x, y, 3 + beat * 2 * ((x + y) % 80 === 0), 0, TAU); ctx.fill(); }
  ctx.save(); ctx.translate(lerp(560, 760, sw), 360); ctx.rotate(t * .8);
  for (let q = 0; q < 4; q++){ ctx.fillStyle = ['#e63b2e', '#1b1b1b', '#e63b2e', '#f2eee3'][q]; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 200, q * Math.PI / 2, (q + 1) * Math.PI / 2); ctx.fill(); }
  ctx.restore();
  for (let k = 0; k < 4; k++){ ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(lerp(560, 760, sw), 360, 230 + k * 22 + beat * 10, 0, TAU); ctx.stroke(); }
  ctx.save(); ctx.translate(lerp(1000, 380, sw), lerp(220, 520, sw)); ctx.rotate(-t * 1.4); fillPoly([[0, -110], [95, 55], [-95, 55]], '#f4c20d'); ctx.restore();
  ctx.save(); ctx.translate(lerp(1050, 1060, sw), lerp(520, 200, sw)); ctx.rotate(t * .5 + sw * Math.PI / 2); ctx.fillStyle = '#1f4fa3'; ctx.fillRect(-80, -80, 160, 160); ctx.restore();
  ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 12; for (let k = 0; k < 3; k++){ const x = ((t * 300 + k * 430) % 1600) - 160; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 180, H); ctx.stroke(); }
  ctx.fillStyle = '#e63b2e'; ctx.beginPath(); ctx.arc(1180, 640, 30 + beat * 16, 0, TAU); ctx.fill();
}

/* ================= reel ================= */
const STYLES = [
  ['Pastel sketch (Robo)', s01], ['Whiteboard', s02], ['Chalkboard', s03], ['3Blue1Brown-style math', s04], ['Blueprint schematic', s05],
  ['Flat vector motion graphics', s06], ['Infographic / data story', s07], ['Map / travel', s08], ['Isometric 3D', s09], ['Kinetic typography', s10],
  ['Newspaper / collage', s11], ['Pixel art + data', s12], ['Pixel art + map', s13], ['Terminal / ASCII', s14], ['Neon synthwave', s15],
  ['Vintage cartoon', s16], ['Low-poly', s17], ['Stick-figure comic', s18], ['Paper cut-out', s19], ['Claymation-ish', s20],
  ['Origami', s21], ['Silhouette / shadow puppet', s22], ['Watercolour-ish', s23], ['Ink / sumi-e brush', s24], ['Geometric abstract', s25],
];
const DUR = SEG * STYLES.length;
function chip(i, lt){
  const a = seg(lt, .05, .3); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; const label = `${String(i + 1).padStart(2, '0')} / ${STYLES.length}`, name = STYLES[i][0];
  ctx.font = `600 18px ${SANS}`; const w1 = ctx.measureText(label).width, w2 = ctx.measureText(name).width, w = w1 + w2 + 48;
  ctx.fillStyle = 'rgba(15,15,20,.78)'; ctx.beginPath(); ctx.roundRect(24, H - 70, w, 42, 21); ctx.fill();
  ctx.fillStyle = '#9aa0ad'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(label, 44, H - 49); ctx.fillStyle = '#ffffff'; ctx.fillText(name, 60 + w1, H - 49);
  ctx.restore();
}
function render(T){
  const i = Math.min(STYLES.length - 1, Math.floor(T / SEG)), lt = T - i * SEG;
  ctx.setTransform(K, 0, 0, K, 0, 0); ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = true; seed = (Math.floor(T * 8) + 1) * 7919;
  ctx.save(); STYLES[i][1](lt); ctx.restore();
  const f = Math.max(seg(.15 - lt, 0, .15), seg(lt, SEG - .15, SEG)); if (f > 0){ ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
  chip(i, lt);
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(0, H - 4, W, 4); ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(0, H - 4, W * T / DUR, 4);
  if (!playing){ ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(W - 44, 20, 7, 24); ctx.fillRect(W - 32, 20, 7, 24); }
}
function resize(){ const dpr = Math.min(2, devicePixelRatio || 1), s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); K = cv.width / W; }
let T = 0, playing = true, last = null;
function tick(now){ if (last === null) last = now; const dt = Math.min(.1, (now - last) / 1000); last = now; if (playing) T = (T + dt) % DUR; render(T); requestAnimationFrame(tick); }
cv.addEventListener('click', () => playing = !playing);
addEventListener('keydown', e => {
  if (e.key === ' '){ e.preventDefault(); playing = !playing; }
  else if (e.key === 'ArrowRight') T = (Math.floor(T / SEG) + 1) % STYLES.length * SEG;
  else if (e.key === 'ArrowLeft') T = ((Math.floor(T / SEG) - 1 + STYLES.length) % STYLES.length) * SEG;
});
addEventListener('resize', () => { resize(); render(T); });
const q = new URLSearchParams(location.search), qs = parseInt(q.get('s')), qt = parseFloat(q.get('t'));
if (!isNaN(qs)) T = clamp(qs - 1, 0, STYLES.length - 1) * SEG;
if (!isNaN(qt)){ T = clamp(qt, 0, DUR - .001); playing = false; }
window.renderAt = t => { T = t; playing = false; render(T); };
resize(); requestAnimationFrame(tick);
</script>
